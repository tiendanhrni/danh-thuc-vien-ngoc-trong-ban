<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#fff}
.clip{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  overflow:hidden;
}
iframe{
  position:absolute;
  top:-130px;
  left:0;
  width:100%;
  height:calc(100% + 130px);
  border:none;
}
</style>
</head>
<body>
<div class="clip">
  <iframe
    src="https://notebooklm.google.com/notebook/c89aedea-4f7a-4fb9-be3f-f10aed45d871/preview"
    allow="microphone"
    referrerpolicy="no-referrer-when-downgrade"
  />
</div>
</body>
</html>
