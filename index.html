const QUIZ_QUESTIONS=[
  {id:1,part:1,q:"Từ khóa nào mô tả đúng nhất về tình trạng nội tâm của bạn hiện tại?",opts:["Chông chênh, trống rỗng và kiệt quệ cảm xúc dù bề ngoài vẫn ổn.","Đang tập quay về bên trong, có lúc bình an nhưng đôi khi vẫn bị ngoại cảnh làm dao động.","Vững chãi, tĩnh tại và sẵn sàng lan tỏa năng lượng bình an này đến những người xung quanh."]},
  {id:2,part:1,q:"Thách thức lớn nhất mà bạn đang phải đối diện lúc này là gì?",opts:["Không biết mình thực sự muốn gì, cảm thấy lạc lối và mất niềm tin vào chính mình.","Biết mình cần thay đổi nhưng chưa duy trì được thói quen tỉnh thức, cần sự đồng hành để không bỏ cuộc.","Đang làm nghề giúp người nhưng thiếu hệ thống chuẩn để đóng gói giá trị và tạo tác động sâu rộng hơn."]},
  {id:3,part:1,q:"Khi gặp một vấn đề khó khăn, phản ứng thường thấy nhất của bạn là:",opts:["Cảm thấy sợ hãi, bế tắc và lập tức đi tìm giải pháp nhanh hoặc lời khuyên từ người khác.","Đang tập xem vấn đề là bài học, dùng 'thần chú' tĩnh tâm nhưng thỉnh thoảng vẫn bị cuốn theo cảm xúc.","Bình thản đón nhận, tự làm việc sâu chính mình và xem đó là cơ hội để nâng tầm tư duy."]},
  {id:4,part:1,q:"Trải nghiệm của bạn đối với các giải pháp phát triển bản thân trước đây ra sao?",opts:["Thường mua các khóa học hứa hẹn thành công nhanh, nhưng sau đó lại thấy kiệt sức như 'uống nước muối khi khát'.","Đã học nhiều kiến thức sâu sắc nhưng chỉ dừng ở bề nổi, biết kiến thức nhưng chưa thực sự 'sống' được với nó.","Đã chuyển hóa mạnh mẽ, hiện đang ứng dụng tốt nhưng muốn chuẩn hóa để có thể giúp đỡ người khác."]},
  {id:5,part:2,q:"Chất lượng cuộc đối thoại nội tâm (Self-talk) của bạn mỗi ngày diễn ra như thế nào?",opts:["Thường xuyên tự phán xét, trách móc và tự nhủ 'mình không thể', 'mình không đủ giỏi'.","Đang nhận diện được những suy nghĩ tự phá hoại và cố gắng dùng tự chiêm nghiệm để chuyển đổi chúng.","Hoàn toàn làm chủ tâm trí, biết cách tự chiêm nghiệm và nuôi dưỡng niềm tin vững chắc vào bản thân."]},
  {id:6,part:2,q:"Khi một người thân hoặc bạn bè tìm đến bạn để tâm sự vấn đề của họ, bạn thường làm gì?",opts:["Lập tức đưa ra góc nhìn, lời khuyên và chỉ cho họ cách giải quyết theo ý mình.","Cố gắng lắng nghe nhiều hơn, hạn chế khuyên bảo nhưng đôi lúc vẫn bị phán xét hoặc đóng khung vấn đề.","Lắng nghe rỗng lặng, không giả định và dùng câu hỏi chất lượng để khai mở trí tuệ cho họ tự tìm câu trả lời."]},
  {id:7,part:2,q:"Khát khao cốt lõi của bạn đối với việc giúp đỡ người khác là gì?",opts:["Lúc này tôi chỉ muốn giải quyết vấn đề cá nhân và tìm thấy sự bình yên cho riêng mình trước.","Tôi muốn giúp gia đình, đồng nghiệp hoặc đội nhóm của mình tốt lên nhưng lo sợ bản thân chưa đủ năng lực.","Việc phụng sự cuộc đời là sứ mệnh lớn nhất của tôi, tôi muốn đồng hành cùng sự phát triển của con người."]},
  {id:8,part:2,q:"Mức độ tin tưởng của bạn vào 'trí tuệ bên trong' của chính mình?",opts:["Rất thấp. Tôi thường xuyên do dự trước mọi quyết định và phụ thuộc vào ý kiến người khác.","Đang cải thiện. Tôi đã bắt đầu lắng nghe trực giác nhưng thỉnh thoảng vẫn hoài nghi bản thân.","Tuyệt đối. Tôi có một niềm tin không lay chuyển rằng mọi câu trả lời tôi cần đều có sẵn ở bên trong."]},
  {id:9,part:3,q:"Nếu được lựa chọn một vai trò tương lai cho bản thân, bạn muốn hướng tới điều gì nhất?",opts:["Một người bình thường sống vui vẻ, cân bằng, không còn căng thẳng hay áp lực.","Một người lãnh đạo/cha mẹ/quản lý biết ứng dụng sự tỉnh thức để làm việc hiệu quả và hòa hợp hơn.","Một người kiến tạo di sản mang giá trị mình có phụng sự cuộc đời."]},
  {id:10,part:3,q:"Động lực nào thúc đẩy bạn tìm đến sự đồng hành của RNI lúc này?",opts:["Tìm kiếm sự thấu hiểu, một hướng đi để thoát khỏi những vòng lặp bế tắc hiện tại.","Tìm kiếm một môi trường phù hợp để học tập, vun bồi, hàm dưỡng nội tại.","Tìm kiếm một nền tảng giáo dục chuẩn quốc tế để tỏa sáng, trao giá trị và đồng hành kiến tạo cộng đồng lớn."]},
  {id:11,part:3,q:"Bạn sẵn sàng cam kết như thế nào cho sự phát triển bản thân trong giai đoạn tới?",opts:["Có thể tham gia các khóa học ngắn hạn hoặc các buổi workshop mở rộng nhận thức.","Cam kết thời gian thực hành mỗi ngày và tham gia lộ trình chuyên sâu để tự chuyển hóa bản thân.","Cam kết cao độ (đầu tư tài chính, thời gian, tâm huyết) để học hỏi kỹ năng và nhận chứng chỉ quốc tế."]},
  {id:12,part:3,q:"Hiện tại, bạn định nghĩa như thế nào về khái niệm 'Khai vấn' (Coaching)?",opts:["Là một dịch vụ mà người Coach sẽ tư vấn và giải quyết triệt để vấn đề cho tôi.","Là công cụ giúp tôi đối thoại với nội tâm, nâng tầm tư duy và làm chủ cảm xúc.","Là một sứ mệnh đi vào tâm trí người khác, khơi gợi nhận thức bằng những năng lực cốt lõi theo chuẩn toàn cầu."]}

          practice:{type:'journal',prompt:'Dành 10 phút yên tĩnh để trả lời câu hỏi: "Tôi đang sống vì điều gì, và cuộc đời này đang được dẫn dắt bởi ai?" Hãy viết ra cảm giác của bạn khi đối diện với câu hỏi này.',placeholder:'Tôi đang sống vì:\n\nCuộc đời tôi đang được dẫn dắt bởi:\n\nCảm giác của tôi khi đối diện với điều này:\n'}},
        {id:'N-1-2',title:'Trắc nghiệm: Ngọn hải đăng trong bạn đang sáng hay tắt?',
          desc:'Cung cấp một cái nhìn trung thực về việc ai đang thực sự sống trong "ngôi nhà cuộc đời" của bạn — là bạn hay là kỳ vọng của người khác? Đây là bước khởi đầu để thắp lại ánh sáng dẫn đường.',
          videoId:null,
          quiz:[
            {q:'Ngọn hải đăng bên trong bị tắt thường do lý do nào?',opts:['Do gặp phải những biến cố quá lớn.','Do ta mải miết sống theo kỳ vọng, tiêu chuẩn của số đông và rời xa ánh sáng bên trong quá lâu.','Do ta không đủ giỏi hoặc không đủ tốt.'],correct:1},
            {q:'Tại sao một người có thể cảm thấy lạc lối ngay cả khi cuộc sống bên ngoài trông rất "ổn"?',opts:['Vì họ chưa đạt được đủ những mục tiêu lớn hơn.','Vì họ đã rời xa ánh sáng bên trong quá lâu hoặc sống theo kỳ vọng của người khác.','Vì họ thiếu kỹ năng quản lý thời gian và công việc.'],correct:1},
            {q:'"Ngọn hải đăng bên trong" thực chất là hệ quy chiếu sống dựa trên yếu tố nào?',opts:['Các tiêu chuẩn đạo đức và chuẩn mực của số đông xã hội.','Giá trị cốt lõi, trực giác và ý định sống của chính cá nhân đó.','Những mục tiêu ngắn hạn và kế hoạch tương lai chi tiết.'],correct:1},
            {q:'Theo kết quả trắc nghiệm, trạng thái ngọn hải đăng "Mờ" (17–23 điểm) có nghĩa là:',opts:['Bạn đã hoàn toàn lạc lối và không thể quay về.','Bạn không lạc lối, nhưng bạn đã đi quá lâu mà không dừng lại để nhìn lại chính mình.','Bạn đang sống trong một lớp sương mù dày đặc và cần vùng vẫy để thoát ra.'],correct:1}
          ],
          practice:{type:'journal',prompt:'Bài tập Ngôi nhà tâm hồn: Hãy nhắm mắt lại và hình dung cuộc đời mình là một ngôi nhà. Trung thực ghi lại: "Ai đang thực sự sống trong ngôi nhà đó? Là chính bạn, hay là kỳ vọng của gia đình, là nỗi sợ bị bỏ lại?"',placeholder:'Khi tôi hình dung ngôi nhà cuộc đời mình, tôi thấy:\n\nAi đang thực sự sống trong đó:\n\nĐiều tôi muốn thay đổi:\n'}},
        {id:'N-1-3',title:'Thắp sáng lại ngọn hải đăng bên trong',
          desc:'Trang bị cho bạn dũng khí để đối diện với chính mình, thấu hiểu giá trị cốt lõi từ những vùng tối và nhận lại tay lái cuộc đời thông qua việc chọn cách phản ứng với mọi biến cố.',
          videoId:null,
          quiz:[
            {q:'Theo nguyên lý "Dám đi vào bóng tối", những cảm xúc "tiêu cực" nên được nhìn nhận như thế nào?',opts:['Là vấn đề cần phải xóa bỏ ngay lập tức.','Là những sứ giả trung thực dẫn bạn về với hệ giá trị sống của chính mình.','Là dấu hiệu của sự yếu đuối cần che đậy.'],correct:1},
            {q:'"Trách nhiệm tuyệt đối" nghĩa là gì?',opts:['Tự trách bản thân về những sai lầm quá khứ.','Chuyển vị trí từ nạn nhân sang người kiến tạo, chọn cách phản ứng với những gì xảy ra.','Phủ nhận những tổn thương đã qua.'],correct:1},
            {q:'Ý nghĩa của nguyên lý "Dám một mình" trong việc tìm lại chính mình là gì?',opts:['Cắt đứt mọi kết nối xã hội để sống cuộc đời cô độc.','Dám rút khỏi tiếng ồn bên ngoài để lắng nghe trí tuệ bên trong cất tiếng.','Chứng tỏ sự mạnh mẽ và không cần sự giúp đỡ của bất kỳ ai.'],correct:1},
            {q:'Tại sao "nơi tối nhất cũng là nơi ánh sáng tỏa rạng nhất"?',opts:['Vì những giá trị cốt lõi thường lộ diện khi ta dám quan sát những cảm xúc khó chịu vốn bị né tránh.','Vì bóng tối là kẻ thù cần phải bị tiêu diệt bằng ánh sáng tích cực.','Vì chỉ khi rơi vào đau khổ cùng cực con người mới có động lực thay đổi.'],correct:0}
          ],
          practice:{type:'journal',prompt:'Bắt đầu từ hôm nay, mỗi khi có cảm xúc khó chịu, hãy dừng lại và hỏi: "Giá trị nào của tôi đang bị chạm vào ở đây?" (ví dụ: sự chính trực, tự do, tôn trọng...) và ghi chép lại.',placeholder:'Cảm xúc khó chịu tôi đang có:\n\nGiá trị đang bị chạm vào:\n\nThông điệp cảm xúc này muốn nói với tôi:\n'}},
        {id:'N-1-4',title:'Trạm soi sáng — Định',
          desc:'Giúp bạn không còn bị lôi kéo bởi "tiếng hát Siren" của những kỳ vọng bên ngoài, từ đó xác định hướng đi đúng đắn khiến bạn cảm thấy đang thực sự sống thay vì chỉ đang vận hành.',
          videoId:null,
          quiz:[
            {q:'Sự khác biệt lớn nhất khi "Trái tim làm la bàn" so với "Nỗi sợ cầm lái" là gì?',opts:['Trái tim hứa hẹn một con đường dễ dàng hơn.','Người đi bằng nỗi sợ cần lý do để tiếp tục, người đi bằng trái tim thì chính con đường đã là lý do.','Nỗi sợ không bao giờ sử dụng lý trí để ngụy trang.'],correct:1},
            {q:'"Mục tiêu từ trái tim" (Heart Goals) được nhận diện qua dấu hiệu nào?',opts:['Khi nghĩ về nó, bạn thấy nặng trĩu nhưng biết là "nên làm".','Khi nghĩ về nó, tim bạn ấm lên hoặc sáng lên, dù có thể đi kèm một chút sợ hãi.','Đó là mục tiêu mà đám đông cho là đúng và đẹp.'],correct:1},
            {q:'Làm thế nào để nhận diện khi "Nỗi sợ đang cầm lái" cuộc đời bạn?',opts:['Khi bạn cảm thấy lười biếng và không muốn làm gì cả.','Khi bạn vẫn rất chăm chỉ nhưng mọi bước đi đều nặng nề và nỗi sợ luôn ngụy trang bằng những lý do "hợp lý".','Khi bạn gặp quá nhiều rủi ro và biến cố trong công việc.'],correct:1},
            {q:'Bài học lớn nhất từ câu chuyện Odysseus và tiếng hát Siren là gì?',opts:['ĐỊNH không phải là không sợ, mà là biết mình đi đâu và có phương cách bảo vệ hướng đi khi nỗi sợ dâng cao.','Muốn về đích thì phải bịt tai trước mọi lời góp ý của những người xung quanh.','Chỉ những người anh hùng mới có thể chiến thắng được những cám dỗ của cuộc đời.'],correct:0}
          ],
          practice:{type:'journal',prompt:'Kiểm tra mục tiêu (Heart Goals): Chọn một mục tiêu quan trọng hiện tại và chấm điểm từ 1-10: Khi nghĩ về nó, tim bạn ấm lên hay nặng trĩu? Nếu không ai biết đến, bạn còn muốn làm không?',placeholder:'Mục tiêu tôi muốn kiểm tra:\n\nKhi nghĩ về nó, tôi cảm thấy (1-10):\n\nNếu không ai biết, tôi có còn muốn làm không?\n\nĐây có thực sự là Heart Goal của tôi không?\n'}},
        {id:'N-1-5',title:'Trạm soi sáng — Tĩnh',
          desc:'Hướng dẫn cách tinh giản để tạo không gian cho những giá trị cốt lõi xuất hiện, giúp con tàu cuộc đời nhẹ nhàng hơn để vươn ra khơi xa. Bởi vì bạn thường cảm thấy kiệt sức không phải do không đủ chăm chỉ — mà vì đang mang theo quá nhiều thứ không cần thiết hoặc đã hết hạn sử dụng.',
          videoId:null,
          quiz:[
            {q:'Mục đích cốt lõi của việc "Tinh giản" trong thiết kế cuộc đời là gì?',opts:['Bỏ hết tất cả mọi thứ để sống tối giản.','Giữ lại những gì cốt lõi nhất để tạo không gian cho các giá trị thực sự xuất hiện.','Để chứng minh mình là người sống tiết kiệm.'],correct:1},
            {q:'Bạn thường cảm thấy kiệt sức vì lý do gì theo nguyên lý "Tĩnh"?',opts:['Vì bạn không đủ chăm chỉ.','Vì bạn mang theo quá nhiều thứ không cần thiết hoặc đã hết hạn sử dụng.','Vì bạn chưa có đủ các thiết bị công nghệ hiện đại.'],correct:1},
            {q:'Tại sao "Hiểu biết mà không hành động" lại là vấn đề của 90% mọi người?',opts:['Vì họ thiếu một hệ thống giúp biến nhận thức thành hành động và một môi trường nâng đỡ đủ mạnh.','Vì kiến thức họ học được chưa thực sự hay và thực tế.','Vì họ chưa có đủ quyết tâm và nỗ lực cá nhân.'],correct:0},
            {q:'Tình trạng "biết nhiều nhưng không tiêu hóa được" dẫn đến hệ quả gì?',opts:['Giúp họ trở nên thông thái và có nhiều kiến thức hơn người khác.','Trở thành nạn nhân của sự thừa thãi, gây ra sự mệt mỏi nội tâm và hoang mang hơn cả lúc chưa học.','Kích thích não bộ hoạt động nhanh hơn để tìm ra các giải pháp mới.'],correct:1}
          ],
          practice:{type:'journal',prompt:'Chiếc vali cuộc đời: Tưởng tượng bạn chỉ được mang một chiếc vali 10kg cho hành trình năm tới. Hãy viết ra 3 thứ (thói quen, mối quan hệ, hoặc nỗi đau cũ) bạn sẽ loại bỏ ngay để "nhẹ gánh" hơn.',placeholder:'Thứ tôi muốn loại bỏ khỏi chiếc vali cuộc đời:\n1.\n2.\n3.\n\nCảm giác tôi khi tưởng tượng mình đã buông bỏ được những điều đó:\n'}},
        {id:'N-1-6',title:'Trạm soi sáng — Đủ',
          desc:'Giúp bạn thiết kế một cuộc sống đủ đầy, nơi thành công không phải trả giá bằng sự kiệt quệ và mọi khía cạnh quan trọng đều được chăm sóc. Chữ "Đủ" không có nghĩa là dừng lại — mà là khi những mảnh ghép quan trọng của đời sống đều được nhìn thấy, chăm sóc và cân bằng.',
          videoId:null,
          quiz:[
            {q:'Chữ "ĐỦ" trong bài học được hiểu là:',opts:['Có thật nhiều tiền bạc và thành tựu.','Khi những mảnh ghép quan trọng của đời sống đều được nhìn thấy, chăm sóc và cân bằng.','Dừng lại hoàn toàn và không còn khao khát gì nữa.'],correct:1},
            {q:'Khi một người dùng sự nghiệp để bù đắp cho sự bất an nội tâm, họ đang vi phạm nguyên lý nào?',opts:['Nguyên lý "Tĩnh".','Nguyên lý "Đủ" (sống lệch, dùng mảnh này bù cho mảnh khác).','Nguyên lý "Định".'],correct:1},
            {q:'Chiến thuật "đặt mục tiêu cực nhỏ trong 30 ngày" cho một mảnh "vàng" hoặc "đỏ" nhằm mục đích:',opts:['Thay đổi hoàn toàn cục diện khía cạnh đó ngay lập tức.','Bắt đầu quá trình chăm sóc lại các giá trị bị bỏ quên một cách nhẹ nhàng và bền vững.','Để thử nghiệm xem khía cạnh đó có thực sự quan trọng với mình không.'],correct:1},
            {q:'Khi đối diện với một "mảnh đỏ" (khía cạnh đang đau hoặc bất ổn), học viên nên làm gì?',opts:['Đặt ra một mục tiêu hoành tráng để thay đổi hoàn toàn cục diện ngay lập tức.','Chấp nhận sự thật và tạm thời phớt lờ nó để tập trung vào những mảnh đang xanh.','Đặt một mục tiêu rất nhỏ trong 30 ngày để bắt đầu chăm sóc lại nó một cách nhẹ nhàng.'],correct:2}
          ],
          practice:{type:'journal',prompt:'Quét 10 khía cạnh: Đánh giá 10 khía cạnh cuộc đời (sức khỏe, gia đình, sự nghiệp, tài chính, bạn bè, bản thân, học hỏi, giải trí, đóng góp, tinh thần). Chọn ra một "mảnh đỏ" hoặc "mảnh vàng" và đặt một mục tiêu nhỏ để chăm sóc nó trong 30 ngày tới.',placeholder:'Đánh giá 10 khía cạnh (1-10):\nSức khoẻ: /10\nGia đình: /10\nSự nghiệp: /10\nTài chính: /10\nBạn bè: /10\nBản thân: /10\nHọc hỏi: /10\nGiải trí: /10\nĐóng góp: /10\nTinh thần: /10\n\nMảnh tôi chọn chăm sóc:\nMục tiêu nhỏ trong 30 ngày:\n'}},
        {id:'N-1-7',title:'Trạm soi sáng — Hiển',
          desc:'Khám phá nguyên lý sự sống là một dòng chảy cho - nhận. Video dẫn dắt bạn tìm kiếm "món quà tự nhiên" – điều bạn làm một cách tự nhiên như cây xanh cho bóng mát — và cách trao đi từ trạng thái đủ đầy mà không kiệt sức.',
          videoId:null,
          quiz:[
            {q:'Trạng thái "HIỂN" tặng đúng nghĩa xuất phát từ đâu?',opts:['Khi cảm thấy mình đã hoàn hảo và cực kỳ thành công.','Khi nội tâm đủ đầy, việc trao đi trở thành một sự tuôn chảy tự nhiên như bản chất của cây xanh hay mặt trời.','Khi bị bắt buộc bởi các nghĩa vụ đạo đức.'],correct:1},
            {q:'Làm sao để nhận diện "món quà tự nhiên" của bạn để hiến tặng cho đời?',opts:['Quan sát điều bạn làm mà quên cả thời gian và điều người khác thường tìm đến bạn để nhờ vả.','Chọn những việc khó nhất mà không ai muốn làm.','Đợi đến khi hoàn hảo và cực kỳ thành công mới bắt đầu trao đi.'],correct:0},
            {q:'Tại sao trao đi từ sự "đủ đầy" lại không làm con người kiệt sức?',opts:['Vì cống hiến lúc này là một sự tuôn chảy tự nhiên của tình thương và sự biết ơn, không phải nghĩa vụ.','Vì người trao đi sẽ nhận lại được sự tôn trọng và tiền bạc tương ứng.','Vì trao đi giúp chúng ta quên đi những nỗi đau của chính mình.'],correct:0},
            {q:'Sự khác biệt giữa "Hiển" tặng chân thật và sự "Hy sinh" gồng mình là gì?',opts:['Hy sinh mang lại kết quả lớn hơn, trong khi hiến tặng chỉ mang tính cá nhân.','Hiến tặng là để bạn được sống đúng bản chất tự nhiên (như cây xanh cho bóng mát), không phải sự nỗ lực ép buộc.','Hiến tặng chỉ dành cho người giàu, còn hy sinh dành cho tất cả mọi người.'],correct:1}
          ],
          practice:{type:'journal',prompt:'Tìm kiếm món quà tự nhiên: Trả lời câu hỏi: "Điều gì tôi làm mà quên cả thời gian?" và "Người khác thường tìm đến tôi vì điều gì?". Hãy dành một khoảng thời gian trong tuần để thực hiện điều đó cho ai đó mà không mưu cầu nhận lại.',placeholder:'Điều tôi làm mà quên cả thời gian:\n\nNgười khác thường tìm đến tôi vì:\n\nTôi sẽ trao đi điều này cho ai, vào khi nào:\n'}},
        {id:'N-1-8',title:'Thiết kế chặng tiếp theo rực rỡ',
          desc:'Phá vỡ "quán tính sống" và trạng thái "tạm ổn" nguy hiểm. Giới thiệu khái niệm Nguyện (cách bạn hiện diện) khác với Mục tiêu (kết quả đạt được) và nghệ thuật tập trung vào Ba trụ cột (Viên đá lớn).',
          videoId:null,
          quiz:[
            {q:'Sự khác biệt giữa "Nguyện" và "Mục tiêu" là gì?',opts:['Mục tiêu hướng về kết quả tương lai; Nguyện hướng về cách bạn hiện diện trong từng khoảnh khắc.','Nguyện có thể thay đổi liên tục, mục tiêu thì không.','Cả hai đều chỉ tập trung vào những gì ta muốn đạt được.'],correct:0},
            {q:'Tại sao ta nên chọn "Ba trụ cột" thay vì cố gắng cân bằng tất cả?',opts:['Vì ta không đủ khả năng làm nhiều việc.','Để tránh sống dàn trải và chấp nhận sự không hoàn hảo ở những mảng khác để tập trung vào điều thiết yếu nhất.','Vì ba luôn là con số hoàn hảo trong mọi lĩnh vực.'],correct:1},
            {q:'Bài học về "cắm rễ sâu" và "nở hoa" của cái cây dạy chúng ta điều gì?',opts:['Chúng ta phải cố gắng nở hoa thật nhanh để chứng minh giá trị của mình.','Mỗi chặng đời có một trọng tâm riêng; ta không thể vừa cắm rễ sâu để vun bồi nội lực vừa đòi hỏi mình phải bừng nở hoa rực rỡ cùng lúc.','Chỉ những người có gốc rễ vững chắc mới xứng đáng được công nhận thành công.'],correct:1},
            {q:'Sức mạnh thực sự của việc "Chọn Nguyện" là gì?',opts:['Nó giúp bạn nhanh chóng đạt được những danh xưng và sự công nhận từ xã hội.','Nó không đưa bạn đi xa hơn người khác, nhưng nó đưa bạn về đúng với chính mình và giúp bạn đứng vững ngay trong hiện tại.','Nó thay thế hoàn toàn cho các mục tiêu thực tế để bạn sống một cuộc đời mơ mộng hơn.'],correct:1}
          ],
          practice:{type:'journal',prompt:'Đặt đá lớn vào bình: Chọn ra 3 trụ cột (viên đá lớn) ưu tiên nhất cho chặng đường này của bạn. Tự nhủ: "Trong chặng này, mình cho phép những mảng khác đi chậm hơn một chút".',placeholder:'3 trụ cột ưu tiên của tôi trong chặng này:\n1.\n2.\n3.\n\nNguyện của tôi (cách tôi muốn hiện diện):\n\nĐiều tôi cho phép mình tạm gác lại:\n'}},
        {id:'N-1-9',title:'Thực hành sống ý nghĩa mỗi ngày',
          desc:'Sức mạnh của Hành động siêu nhỏ trong việc hình thành nếp sống mới mà không kích hoạt sự chống cự của não bộ. Cách thiết lập Ranh giới để bảo vệ "ngọn đèn" nếp sống trước những "ngọn gió" của thói quen cũ và kỳ vọng bên ngoài.',
          videoId:null,
          quiz:[
            {q:'Tại sao những "Hành động siêu nhỏ" lại có sức mạnh lớn trong việc thay đổi cuộc đời?',opts:['Vì chúng không kích hoạt sự chống cự của não bộ và dễ dàng trở thành nếp sống.','Vì chúng mang lại kết quả bùng nổ ngay lập tức.','Vì chúng yêu cầu kỷ luật thép để thực hiện.'],correct:0},
            {q:'"Ranh giới" được thiết lập nhằm mục đích gì?',opts:['Để đẩy người khác ra xa và sống ích kỷ.','Để che chắn "ngọn đèn" nếp sống mới trước những "ngọn gió" của kỳ vọng, thói quen cũ và sự quá tải.','Để kiểm soát người khác không làm phiền bạn.'],correct:1},
            {q:'Thiết lập "Ranh giới với chính mình" có nghĩa là:',opts:['Luôn trừng phạt bản thân khi không đạt được kế hoạch đề ra.','Không dùng sự mệt mỏi để biện minh cho việc quay lại quán tính cũ và luôn quay về với Nguyện.','Từ chối mọi sở thích cá nhân để tập trung hoàn toàn vào công việc.'],correct:1},
            {q:'Hành động siêu nhỏ hiệu quả nhất cho nếp sống sáng là:',opts:['Thiền 1 giờ mỗi sáng.','Dành 2 phút viết 1 điều bạn biết ơn và 1 ý định cho ngày hôm đó.','Đọc ít nhất 50 trang sách mỗi ngày.'],correct:1}
          ],
          practice:{type:'journal',prompt:'Thiết lập ranh giới bảo vệ: Viết ra 3 ranh giới bạn sẽ thực hiện ngay: 1 với thời gian, 1 với mối quan hệ, và 1 với chính mình.',placeholder:'Ranh giới với thời gian:\n(ví dụ: không điện thoại sau 22h)\n\nRanh giới với mối quan hệ:\n\nRanh giới với chính mình:\n\nNguyện tôi muốn sống mỗi ngày:\n'}}
      ],
      qaLessons:[

  I:{id:'I',title:'Xây Dựng Sự Nghiệp Ý Nghĩa Mang Tên Bạn',subtitle:'Giai đoạn Illuminate — Lan Toả',icon:'✨',accent:'#9b1106',
    modules:[
      {id:1,title:'Khai Vấn Tỉnh Thức — Con Đường Trở Về Nội Tâm',icon:'🌿',
        lessons:[
          {id:'I-1-1',title:'Sự thịnh vượng bên ngoài và sự cạn kiệt bên trong',
            desc:'Bài học khám phá nghịch lý của thời đại mới: khi con người sở hữu đầy đủ tiện nghi vật chất nhưng lại nghèo túng và kiệt quệ về nội tâm. Nội dung giúp bạn nhận diện nguyên nhân dẫn đến tình trạng căng thẳng, mất kết nối và "khoảng trống tâm hồn" do quá tập trung vào những mục tiêu bên ngoài.',
            videoId:'76rOAHAgwVo',
            quiz:[
              {q:'Lý do khiến con người hiện đại dù sở hữu nhiều vật chất nhưng vẫn cảm thấy trống rỗng là gì?',opts:['Do công nghệ phát triển quá nhanh.','Do thiếu các mối quan hệ xã hội.','Do chỉ tập trung vào các điều kiện ngoại cảnh và mục tiêu bên ngoài mà quên mất việc nuôi dưỡng tâm hồn.','Do không có đủ kiến thức chuyên môn.'],correct:2},
              {q:'"Nghịch lý" của thế giới hiện đại được mô tả như thế nào?',opts:['Giàu có về tài sản nhưng nghèo nàn về tâm hồn; đầy đủ tiện nghi nhưng kiệt quệ về nội tâm.','Có nhiều thời gian nhưng không biết cách sử dụng hiệu quả.','Làm việc ít nhưng muốn đạt được thành quả lớn.','Có quá nhiều sự lựa chọn dẫn đến việc không thể quyết định.'],correct:0},
              {q:'Áp lực từ những kỳ vọng xã hội và sự so sánh không ngừng dẫn đến tình trạng nào?',opts:['Sự giàu có bền vững về tinh thần.','Khả năng thích nghi tốt hơn với môi trường.','Kiệt quệ cảm xúc, căng thẳng mãn tính và mất kết nối với chính mình.','Sự thăng tiến nhanh chóng trong sự nghiệp.'],correct:2},
              {q:'Tại sao con người hiện đại dù đạt được nhiều thành công vật chất vẫn thường xuyên cảm thấy mất phương hướng?',opts:['Do tốc độ phát triển công nghệ quá chậm.','Do luôn hướng ra bên ngoài để tìm kiếm sự công nhận thay vì nuôi dưỡng nội tâm.','Do không đủ thời gian để nghỉ ngơi.','Do thiếu các kỹ năng quản lý công việc.'],correct:1}
            ],
            practice:{type:'journal',prompt:'Viết ra danh sách 3 thành tựu bên ngoài bạn đã đạt được và tự vấn xem cảm giác hài lòng đó kéo dài trong bao lâu. Sau đó, liệt kê 1 hoạt động giúp bạn cảm thấy bình an từ bên trong mà không phụ thuộc vào vật chất.',placeholder:'Thành tựu 1: ...\n→ Cảm giác hài lòng kéo dài: ...\n\nThành tựu 2: ...\n→ Cảm giác hài lòng kéo dài: ...\n\nThành tựu 3: ...\n→ Cảm giác hài lòng kéo dài: ...\n\nHoạt động bình an từ bên trong:\n'}},
          {id:'I-1-2',title:'Cuộc khủng hoảng niềm tin',
            desc:'Video này phân tích sâu về "gốc rễ" của sự bất ổn hiện nay: sự mất niềm tin vào chính mình và giá trị tự thân. Bạn sẽ nhận diện được bi kịch của việc quá lệ thuộc vào các giải pháp tạm thời bên ngoài và hiểu rõ tầm quan trọng của việc quay về bên trong.',
            videoId:'GSea5du0njI',
            quiz:[
              {q:'Điều gì được coi là "gốc rễ" của cuộc khủng hoảng niềm tin ở con người hiện đại?',opts:['Sự phản bội từ những người xung quanh.','Sự biến động của nền kinh tế thế giới.','Mất niềm tin vào chính mình và giá trị tự thân.','Thiếu niềm tin vào các giải pháp công nghệ mới.'],correct:2},
              {q:'Tại sao các giải pháp bên ngoài thường không giải quyết được sự bất ổn nội tâm?',opts:['Vì chúng quá đắt đỏ.','Vì chúng giống như "nước muối", chỉ mang lại cảm giác tạm thời và khiến ta thêm kiệt sức về lâu dài.','Vì chúng không cung cấp đủ thông tin cần thiết.','Vì xã hội không công nhận các giải pháp đó.'],correct:1},
              {q:'Điều nguy hiểm nhất trong "cuộc khủng hoảng niềm tin" là gì?',opts:['Không có đủ tài chính để đầu tư.','Tin vào những điều sai lầm như giá trị bản thân phụ thuộc vào sở hữu vật chất hoặc ý kiến người khác.','Thiếu các mối quan hệ xã hội chất lượng.','Mất niềm tin vào các giải pháp công nghệ hiện đại.'],correct:1},
              {q:'Gốc rễ của sự bình an và hạnh phúc thực sự nằm ở đâu?',opts:['Ở sự thay đổi hoàn hảo của hoàn cảnh bên ngoài.','Ở việc được xã hội công nhận và tôn vinh.','Ở trạng thái nội tâm và việc quay về bên trong để nhận diện chính mình.','Ở khả năng kiểm soát mọi biến động của cuộc sống.'],correct:2}
            ],
            practice:{type:'journal',prompt:'Nhận diện 1 tình huống gần đây bạn cảm thấy mất kiểm soát. Thay vì đi tìm lời khuyên ngay lập tức, hãy dành 15 phút để "quay về bên trong", quan sát trạng thái nội tâm của mình lúc đó.',placeholder:'Tình huống tôi cảm thấy mất kiểm soát:\n\nKhi tôi "quay về bên trong", tôi nhận ra:\n\nTrạng thái nội tâm của tôi lúc đó là:\n\nĐiều tôi thực sự cần lúc này:\n'}},
          {id:'I-1-3',title:'Khai vấn tỉnh thức — con đường trở về nội tâm',
            desc:'Bài học tập trung vào việc nâng tầm tư duy và khơi dậy trí tuệ nội tại để bạn có thể đứng vững trước những bão giông cuộc đời. Đây là hành trình giúp bạn nuôi dưỡng sự bình an, sáng suốt từ gốc rễ để làm chủ cuộc sống bên ngoài.',
            videoId:'9jmrTIGg6mM',
            quiz:[
              {q:'Trong hình ảnh "cây cổ thụ", yếu tố nào quyết định khả năng đứng vững trước bão giông?',opts:['Những cành lá vươn cao.','Tán bóng râm rộng lớn.','Bộ rễ đâm sâu và mạnh mẽ vào lòng đất (nội tâm).','Sự chăm sóc từ môi trường bên ngoài.'],correct:2},
              {q:'Trái tim của "Khai vấn tỉnh thức" tại RNI tập trung vào mục tiêu cốt lõi nào?',opts:['Cung cấp các câu trả lời định sẵn cho khách hàng.','Nuôi dưỡng nội tâm bình an, sáng suốt để làm chủ cuộc sống và khơi dậy trí tuệ nội tại.','Giải quyết nhanh các vấn đề thực tế trước mắt.','Xây dựng một bản đồ lộ trình sự nghiệp cố định.'],correct:1},
              {q:'Khai vấn tỉnh thức tập trung vào sự phát triển toàn diện nào của một người Coach tại RNI?',opts:['Chỉ tập trung vào kỹ năng đặt câu hỏi.','Chỉ tập trung vào xây dựng sự nghiệp kinh doanh.','Vun bồi bản thể người Coach, rèn luyện kỹ năng và xây dựng sự nghiệp khai vấn.','Tập trung vào việc giải quyết mọi vấn đề thực tế cho khách hàng.'],correct:2},
              {q:'Năng lực "tỉnh thức" của người Coach có vai trò gì trong phiên khai vấn?',opts:['Giúp Coach đưa ra lời khuyên chính xác hơn.','Kiến tạo không gian để trí tuệ của bản thân và khách hàng được sinh khởi.','Giúp khách hàng nhanh chóng quên đi nỗi đau.','Dùng để thuyết phục khách hàng thay đổi theo ý mình.'],correct:1}
            ],
            practice:{type:'journal',prompt:'Hãy chọn một vấn đề đang làm bạn trăn trở và đặt cho mình một câu hỏi khai vấn: "Nếu tôi có trí tuệ nội tại hoàn hảo, tôi sẽ nhìn nhận vấn đề này như thế nào?"',placeholder:'Vấn đề đang làm tôi trăn trở:\n\nNếu tôi có trí tuệ nội tại hoàn hảo, tôi sẽ nhìn nhận vấn đề này là:\n\nBước nhỏ tôi có thể làm ngay hôm nay:\n'}}
        ]},
      {id:2,title:'Trở Thành Người Coach Của Chính Mình',icon:'🧭',
        lessons:[
          {id:'I-2-1',title:'Giá trị thực sự của khai vấn',
            desc:'Nội dung tập trung vào 3 giá trị cốt lõi: Khai phóng thay vì khuyên bảo, Khai mở thay vì đóng khung phán xét, và Khám phá thay vì giả định. Đây là nền tảng để bạn trao tặng chính mình và người khác món quà của sự tự do và trí tuệ.',
            videoId:'H4V0tShRoR4',
            quiz:[
              {q:'Khác biệt lớn nhất giữa lời khuyên thông thường và khai vấn (Coaching) là gì?',opts:['Khai vấn đưa ra lời khuyên chuyên sâu hơn.','Khai vấn không đưa ra câu trả lời hay lời khuyên mà dùng câu hỏi chất lượng để khai phóng tiềm năng.','Lời khuyên giúp giải quyết vấn đề nhanh hơn khai vấn.','Khai vấn chỉ tập trung vào những điều tích cực.'],correct:1},
              {q:'Nguyên tắc "Đừng đóng khung, hãy khai mở" trong khai vấn có nghĩa là gì?',opts:['Dán mác mọi sự việc theo tiêu chuẩn đúng/sai của xã hội.','Cố gắng tìm ra lỗi sai của người khác để sửa đổi.','Nhìn nhận sự việc khách quan, trung tính và mở rộng tư duy để thấy vấn đề không còn là vấn đề.','Luôn đồng ý với mọi quan điểm của khách hàng.'],correct:2},
              {q:'Tại sao xã hội hiện đại lại "thừa thãi lời khuyên nhưng thiếu hụt câu hỏi chất lượng"?',opts:['Vì mọi người đều quá thông minh.','Vì con người có xu hướng muốn chứng tỏ giá trị bằng cách đưa ra quan điểm cá nhân thay vì khai phóng tâm thức người khác.','Vì lời khuyên luôn là giải pháp tốt nhất.','Vì việc đặt câu hỏi mất quá nhiều thời gian.'],correct:1},
              {q:'Trạng thái "tâm trí rỗng lặng" của người Coach giúp ích gì trong quá trình lắng nghe?',opts:['Giúp Coach ghi nhớ được nhiều thông tin hơn.','Giúp Coach chuẩn bị sẵn câu trả lời tiếp theo.','Giúp tháo bỏ lớp kính giả định để trí tuệ khởi sinh và khám phá chân thực con người khách hàng.','Giúp Coach không cảm thấy mệt mỏi khi nghe khách hàng than vãn.'],correct:2}
            ],
            practice:{type:'text',prompt:'Luyện tập "lắng nghe rỗng lặng" trong 5 phút với người thân: lắng nghe mà không giả định, không phán xét và không chuẩn bị lời khuyên trong đầu.'}},
          {id:'I-2-2',title:'Khai vấn dành cho những con người can đảm bước chân trên con đường không lối',
            desc:'Nội dung tôn vinh sự can đảm của người Coach khi dám bước vào "vùng đất vô định" trong tâm trí con người mà không có bản đồ sẵn có. Bài học chia sẻ về sứ mệnh giúp người khác tìm lại ý nghĩa cuộc sống trong một thế giới đầy biến động.',
            videoId:'IZDvNTotncA',

/* ─── HELPERS ──────────────────────────────────────────────────────── */
const getModules=(cId)=>COURSES[cId]?.modules||[];
const getAllLessons=(cId)=>getModules(cId).flatMap(m=>m.lessons.map(l=>({...l,moduleId:m.id,isQA:!!m.isQA,isStory:!!m.isStory})));
const isUnlocked=(lId,prog,cId)=>{const all=getAllLessons(cId);const i=all.findIndex(l=>l.id===lId);if(i===0)return true;return !!prog[all[i-1]?.id];};
// Course complete = watched first story lesson
const isCourseComplete=(prog,cId)=>{const all=getAllLessons(cId);const storyLesson=all.find(l=>l.isStory);return storyLesson?!!prog[storyLesson.id]:all.every(l=>!!prog[l.id]);};

      <img src={product.img} alt={product.title} className="w-14 h-14 object-cover rounded-lg flex-shrink-0" onError={e=>e.target.style.display='none'}/>
      <div className="min-w-0">
        <span className="text-xs text-rni-600 font-semibold">{product.tag}</span>
        <p className="text-xs font-semibold text-gray-800 leading-snug mt-0.5 line-clamp-2">{product.title}</p>
        <p className="text-xs text-rni-600 mt-1">Tìm hiểu thêm →</p>
      </div>
    </a>
  );
}

}

function QuizScreen({onDone}){
  const [idx,setIdx]=useState(0);
  const [answers,setAnswers]=useState([]);
  const [sel,setSel]=useState(null);
  const [busy,setBusy]=useState(false);
  const q=QUIZ_QUESTIONS[idx];
  const partLabels={1:"Bạn đang thấy gì ở chính mình lúc này?",2:"Bạn đang nuôi dưỡng điều gì bên trong?",3:"Bạn đang hướng về đâu?"};
  const partIntros={1:"Không cần suy nghĩ quá nhiều. Hãy chọn điều gần với bạn nhất lúc này.",2:"Quan sát thật nhẹ nhàng — không cần đánh giá bản thân.",3:"Đây là phần cuối — hãy để trực giác dẫn lối."};
  const isFirst=idx===0||QUIZ_QUESTIONS[idx-1].part!==q.part;

  const pick=(i)=>{
    if(busy)return;
    setSel(i);setBusy(true);
    setTimeout(()=>{
      const na=[...answers,i];
      setAnswers(na);setSel(null);setBusy(false);
      if(idx<QUIZ_QUESTIONS.length-1){setIdx(idx+1);}
      else{
        const c={0:0,1:0,2:0};na.forEach(a=>c[a]++);
        let r='R';if(c[2]>=c[1]&&c[2]>=c[0])r='I';else if(c[1]>=c[0]&&c[1]>=c[2])r='N';
        onDone(r);
      }
    },320);
  };

  return(
    <div className="min-h-screen flex flex-col hero-bg">
      <div className="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-20">
        <div className="max-w-lg mx-auto">
          <div className="flex items-center justify-between mb-2">
            <p className="text-xs font-semibold text-rni-500">{partLabels[q.part]}</p>
            <span className="text-xs text-gray-400 font-medium">{idx+1}/{QUIZ_QUESTIONS.length}</span>
          </div>
          <PBar val={idx+1} max={QUIZ_QUESTIONS.length}/>
        </div>
      </div>
      <div className="flex-1 flex items-start justify-center px-4 py-7">
        <div className="max-w-lg w-full">
          {isFirst&&<div className="mb-5 text-center fade-in">
            <span className="inline-block bg-rni-50 border border-rni-100 text-rni-600 text-xs font-semibold px-4 py-1.5 rounded-full mb-1">Phần {q.part}</span>
            <p className="text-gray-400 text-sm italic">{partIntros[q.part]}</p>
          </div>}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-5 fade-in">
            <p className="font-display text-xl font-semibold text-gray-900 leading-relaxed">{q.q}</p>
          </div>
          <div className="space-y-3">
            {q.opts.map((opt,i)=>(
              <button key={i} onClick={()=>pick(i)}
                className={`opt-btn ${sel===i?'selected':''}`}>
                <span className={`inline-flex w-7 h-7 rounded-full border-2 mr-3 items-center justify-center text-xs font-bold flex-shrink-0 align-middle transition-all ${sel===i?'bg-rni-600 border-rni-600 text-white':'border-gray-300 text-gray-400'}`}>{String.fromCharCode(65+i)}</span>
                {opt}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function PracticeBox({practice,lessonId}){

  const save=()=>{

        {practice.type==='journal'&&(
          <>
            {!editing&&text?(
              <div className="bg-green-50 border border-green-200 rounded-xl px-4 py-3">
                <div className="flex items-center justify-between mb-2">
                  <p className="text-xs font-semibold text-green-700 flex items-center gap-1"><span>✅</span> Ghi chép của bạn</p>

      )}
    </>
  );
}

/* ─── LESSON VIEW ──────────────────────────────────────────────── */
function LessonView({lesson,progress,courseId,onComplete,onBack}){
  const [tab,setTab]=useState('video');
  const [qi,setQi]=useState(0);
  const [picked,setPicked]=useState(null);
  const [checked,setChecked]=useState(false);
  const [score,setScore]=useState(0);
  const [quizDone,setQuizDone]=useState(false);
  const [showCelebration,setShowCelebration]=useState(false);

  const all=getAllLessons(courseId);
  const lIdx=all.findIndex(l=>l.id===lesson.id);
  const next=all[lIdx+1]||null;
  const mod=getModules(courseId).find(m=>m.lessons.some(l=>l.id===lesson.id));
  const isSimple=!!mod?.isQA||!!mod?.isStory;
  const isDone=!!progress[lesson.id];
  const accent=COURSES[courseId]?.accent||'#9b1106';

  const handleCheck=()=>{
    if(picked===null)return;
    setChecked(true);
    if(picked===lesson.quiz[qi].correct)setScore(s=>s+1);
  };
  const handleNextQ=()=>{
    if(qi<lesson.quiz.length-1){setQi(qi+1);setPicked(null);setChecked(false);}
    else setQuizDone(true);
  };
  const handleComplete=()=>{onComplete(lesson.id);setShowCelebration(true);};
  const handleGoNext=()=>{setShowCelebration(false);if(next)onComplete(lesson.id);onBack();};

  const tabs=isSimple
    ?[{id:'video',icon:'🎬',label:'Video',sub:'Bài giảng'}]
    :[{id:'video',icon:'🎬',label:'Video',sub:'Bài giảng'},{id:'quiz',icon:'📝',label:'Trắc nghiệm',sub:'Ôn lại kiến thức'},{id:'practice',icon:'🌱',label:'Thực hành',sub:'Áp dụng ngay'}];

  // pick sidebar upsell for this lesson
  const sideUpsell=UPSELL.filter(u=>u.courses.includes(courseId)).slice(0,2);

  return(
    <div className="min-h-screen bg-gray-50">
      {/* header */}
      <div className="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-20">
        <div className="max-w-5xl mx-auto flex items-center gap-3">
          <button onClick={onBack} className="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors flex-shrink-0 font-bold">←</button>
          <div className="flex-1 min-w-0">
            <p className="text-xs text-gray-400 truncate">{mod?.title}</p>
            <p className="text-sm font-semibold text-gray-900 leading-tight truncate">{lesson.title}</p>
          </div>
          {isDone&&<span className="flex-shrink-0 bg-green-100 text-green-700 text-xs font-semibold px-3 py-1 rounded-full">✓ Đã hoàn thành</span>}
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-4 py-5">
        <div className="flex gap-6">
          {/* main */}
          <div className="flex-1 min-w-0">
            {/* lesson header card */}
            <div className="rounded-2xl mb-5 px-6 py-5 text-white" style={{background:`linear-gradient(135deg,${accent},${accent}cc)`}}>
              <p className="text-xs font-semibold uppercase tracking-wider opacity-75 mb-1">{mod?.title?.toUpperCase()}</p>
              <h2 className="font-heading font-black text-xl leading-snug">{lesson.title}</h2>
            </div>

            {/* tabs */}
            {tabs.length>1&&(
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 mb-5 overflow-hidden">
                <div className="grid grid-cols-3">
                  {tabs.map(t=>(
                    <button key={t.id} onClick={()=>setTab(t.id)} className={`flex flex-col items-center py-4 px-2 transition-all ${tab===t.id?'text-white':'bg-white text-gray-500 hover:bg-gray-50'}`} style={tab===t.id?{background:`linear-gradient(135deg,${accent},${accent}dd)`}:{}}>
                      <span className="text-xl mb-1">{t.icon}</span>
                      <p className="text-xs font-bold">{t.label}</p>
                      <p className="text-xs opacity-70">{t.sub}</p>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* VIDEO TAB */}
            {tab==='video'&&(
              <div className="space-y-4 fade-in">
                {lesson.desc&&(
                  <div className="bg-white rounded-2xl border border-gray-100 px-5 py-4">
                    <p className="text-gray-600 text-sm leading-relaxed">{lesson.desc}</p>
                  </div>
                )}
                {lesson.videoId?(
                  <div className="video-outer"><iframe src={`https://www.youtube.com/embed/${lesson.videoId}?rel=0&modestbranding=1`} title={lesson.title} allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowFullScreen/></div>
                ):(
                  <div className="rounded-2xl flex items-center justify-center bg-gray-900" style={{aspectRatio:'16/9'}}>
                    <div className="text-center text-white"><div className="text-5xl mb-3">🎬</div><p className="text-sm font-medium opacity-70">Video sẽ sớm ra mắt</p><p className="text-xs opacity-40 mt-1">Đang trong quá trình sản xuất</p></div>
                  </div>
                )}
                {/* ask button */}
                <button onClick={()=>document.querySelector('.chat-bubble button')?.click()} className="w-full flex items-center justify-center gap-2 border-2 border-dashed border-rni-200 rounded-2xl py-3 text-rni-600 font-semibold text-sm hover:bg-rni-50 transition-all">
                  <span>💬</span> Hỏi đáp thêm về bài học tại đây →
                </button>
                {/* next/complete */}
                {isSimple&&!isDone&&(
                  <button onClick={handleComplete} className="w-full py-3.5 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>
                    Đánh dấu hoàn thành ✓
                  </button>
                )}
                {!isSimple&&(
                  <button onClick={()=>setTab('quiz')} className="w-full py-3 rounded-xl text-white font-semibold text-sm transition-all active:scale-95" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>
                    Tiếp theo → Làm trắc nghiệm
                  </button>
                )}
              </div>
            )}

            {/* QUIZ TAB */}
            {tab==='quiz'&&!isSimple&&(
              <div className="fade-in">
                {!quizDone?(
                  <div className="space-y-4">
                    {/* info box */}
                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4">
                      <p className="text-sm font-semibold text-gray-800 mb-1">📋 Ôn lại kiến thức</p>
                      <p className="text-xs text-gray-500 mb-2">Đây là bước quan trọng giúp bạn <strong>nội hóa kiến thức</strong> từ bài giảng vào tư duy của mình.</p>
                      <div className="flex flex-wrap gap-2 text-xs text-amber-700">
                        <span>✦ Bài có {lesson.quiz.length} câu hỏi</span>
                        <span>✦ Cần đúng ≥ 60% để đạt</span>
                        <span>✦ Có thể làm lại nhiều lần</span>
                      </div>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold px-3 py-1 rounded-full text-white" style={{background:accent}}>Câu {qi+1} / {lesson.quiz.length}</span>
                      <span className="text-xs text-gray-400">{score} đúng · cần ≥ 60%</span>
                    </div>
                    <PBar val={qi+1} max={lesson.quiz.length} color={accent}/>
                    <div className="bg-white rounded-2xl border border-gray-100 p-5">
                      <p className="font-semibold text-gray-900 text-base leading-relaxed">{lesson.quiz[qi].q}</p>
                    </div>
                    <div className="space-y-3">
                      {lesson.quiz[qi].opts.map((opt,i)=>{
                        let cls='';
                        if(checked){if(i===lesson.quiz[qi].correct)cls='correct';else if(i===picked)cls='wrong';}
                        else if(picked===i)cls='selected';
                        return(
                          <button key={i} onClick={()=>!checked&&setPicked(i)} className={`opt-btn ${cls}`}>
                            <span className={`inline-flex w-7 h-7 rounded-full border-2 mr-3 items-center justify-center text-xs font-bold flex-shrink-0 align-middle transition-all ${checked&&i===lesson.quiz[qi].correct?'bg-green-500 border-green-500 text-white':checked&&i===picked?'bg-red-400 border-red-400 text-white':picked===i?'border-rni-600 text-rni-600':'border-gray-300 text-gray-400'}`}>{String.fromCharCode(65+i)}</span>
                            {opt}
                          </button>
                        );
                      })}
                    </div>
                    {!checked?(
                      <button onClick={handleCheck} disabled={picked===null} className="w-full py-3.5 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95 disabled:opacity-40" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>Kiểm tra đáp án</button>
                    ):(
                      <div className="space-y-3">
                        <div className={`rounded-xl px-4 py-3 text-sm font-semibold ${picked===lesson.quiz[qi].correct?'bg-green-100 text-green-700':'bg-red-50 text-red-600'}`}>
                          {picked===lesson.quiz[qi].correct?'✓ Chính xác! Bạn hiểu đúng rồi.':`✗ Chưa đúng. Đáp án là: ${String.fromCharCode(65+lesson.quiz[qi].correct)}.`}
                        </div>
                        <button onClick={handleNextQ} className="w-full py-3.5 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>
                          {qi<lesson.quiz.length-1?'Câu tiếp theo →':'Xem kết quả'}
                        </button>
                      </div>
                    )}
                  </div>
                ):(
                  <div className="text-center py-8 fade-in">
                    <div className="text-5xl mb-4">{score/lesson.quiz.length>=.6?'🏆':'📖'}</div>
                    <h3 className="font-heading font-black text-2xl text-gray-900 mb-2">{score} / {lesson.quiz.length} câu đúng</h3>
                    <p className="text-sm mb-1" style={{color:score/lesson.quiz.length>=.6?'#16a34a':'#9b1106',fontWeight:600}}>
                      {score/lesson.quiz.length>=.6?'✓ Đạt! Bạn đã nắm vững bài học này.':'Chưa đạt — hãy xem lại video và thử lại nhé!'}
                    </p>
                    <p className="text-gray-500 text-sm mb-6">{Math.round(score/lesson.quiz.length*100)}% · Cần đạt ≥ 60%</p>
                    {score/lesson.quiz.length>=.6&&!isDone&&(
                      <button onClick={()=>setTab('practice')} className="w-full py-3.5 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95 mb-3" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>
                        Tiếp theo → Thực hành
                      </button>
                    )}
                    <button onClick={()=>{setQi(0);setPicked(null);setChecked(false);setQuizDone(false);setScore(0);}} className="w-full py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm hover:border-gray-300 transition-all">
                      Làm lại từ đầu
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* PRACTICE TAB */}
            {tab==='practice'&&!isSimple&&(
              <div className="space-y-4 fade-in">
                <PracticeBox practice={lesson.practice} lessonId={lesson.id}/>
                {!isDone&&(
                  <button onClick={handleComplete} className="w-full py-3.5 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>
                    Đánh dấu hoàn thành ✓
                  </button>
                )}
                {isDone&&(
                  <div className="rounded-2xl p-5 text-center" style={{background:`${accent}10`,border:`1.5px solid ${accent}30`}}>
                    <div className="text-3xl mb-2">🎉</div>
                    <p className="font-semibold text-gray-800 mb-1">Bạn đã hoàn thành bài học này!</p>
                    <p className="text-xs text-gray-500">Mỗi bước nhỏ bạn đi hôm nay đang thắp sáng thêm ngọn hải đăng bên trong. Hãy tiếp tục nhé!</p>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* sidebar */}
          <div className="hidden lg:block w-72 flex-shrink-0">
            {sideUpsell.length>0&&(
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
                <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Khám phá thêm từ RNI</p>
                <div className="space-y-3">
                  {sideUpsell.map(u=><UpsellCard key={u.id} product={u}/>)}
                </div>
              </div>
            )}
            <div className="bg-rni-50 border border-rni-100 rounded-2xl p-4">
              <p className="text-xs font-semibold text-rni-600 mb-2">💬 Có câu hỏi về bài học?</p>
              <p className="text-xs text-gray-500 mb-3">Đặt câu hỏi trực tiếp với đội ngũ RNI qua chatbox bên dưới.</p>
              <button onClick={()=>document.querySelector('.chat-bubble button')?.click()} className="w-full py-2 rounded-xl text-rni-600 font-semibold text-xs border-2 border-rni-200 hover:bg-rni-100 transition-all">
                Hỏi đáp tại đây →
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* celebration popup */}
      {showCelebration&&(
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center celebration">
            <div className="text-5xl mb-4 float">🎉</div>
            <h3 className="font-heading font-black text-xl text-gray-900 mb-2">Xuất sắc!</h3>
            <p className="text-gray-500 text-sm mb-6 leading-relaxed">Bạn đã hoàn thành<br/><strong className="text-gray-800">"{lesson.title}"</strong></p>
            <div className="space-y-3">
              {next&&<button onClick={handleGoNext} className="w-full py-3 rounded-xl text-white font-semibold text-sm transition-all active:scale-95" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>Bài tiếp theo →</button>}
              <button onClick={()=>{setShowCelebration(false);onBack();}} className="w-full py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm hover:border-gray-300 transition-all">Quay về tổng quan</button>
            </div>
          </div>
        </div>
      )}

      <ChatButton/>
    </div>
  );
}

/* ─── DASHBOARD ─────────────────────────────────────────────────── */
function Dashboard({userName,courseId,progress,onLesson,onCert}){
  const [expanded,setExpanded]=useState(1);
  const course=COURSES[courseId];
  const mods=getModules(courseId);
  const all=getAllLessons(courseId);
  const r=QUIZ_RESULTS[courseId];
  const done=all.filter(l=>progress[l.id]).length;
  const total=all.length;
  const pct=Math.round(done/total*100);
  const next=all.find(l=>!progress[l.id]);
  const completed=isCourseComplete(progress,courseId);
  const accent=course?.accent||'#9b1106';

  return(
    <div className="min-h-screen bg-gray-50">
      {/* header */}
      <div className="bg-white border-b border-gray-100 px-4 py-4 sticky top-0 z-20">
        <div className="max-w-2xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <LogoSVG size={38}/>
            <div>
              <p className="font-heading font-black text-sm text-gray-900 leading-tight line-clamp-1">{course?.title}</p>
              <p className="text-xs text-gray-400">{course?.subtitle}</p>
            </div>
          </div>
          <div className="text-right">
            <p className="text-xs font-bold" style={{color:accent}}>{pct}%</p>
            <p className="text-xs text-gray-400">{done}/{total} bài</p>
          </div>
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 py-5 space-y-5">
        {/* hero */}
        <div className="rounded-2xl overflow-hidden shadow-sm" style={{background:`linear-gradient(135deg,${accent} 0%,${accent}cc 60%,#d97706 100%)`}}>
          <div className="px-6 py-5 text-white">
            <p className="text-sm opacity-80 mb-0.5">Xin chào,</p>
            <h2 className="font-heading font-black text-2xl mb-3">{userName} ✦</h2>
            <div style={{background:'rgba(255,255,255,.25)',borderRadius:999,height:8,overflow:'hidden',marginBottom:8}}>
              <div className="progress-bar" style={{width:`${pct}%`,height:'100%',background:'white',borderRadius:999}}/>
            </div>
            <div className="flex items-center justify-between">
              <p className="text-xs opacity-75">{done} / {total} bài học hoàn thành</p>
              <p className="text-xs font-bold">{pct}%</p>
            </div>
          </div>
          {!completed&&next&&(
            <div className="bg-black/20 px-6 py-3 flex items-center justify-between">
              <div><p className="text-white/60 text-xs mb-0.5">Tiếp tục học</p><p className="text-white font-semibold text-sm truncate max-w-xs">{next.title}</p></div>
              <button onClick={()=>onLesson(next)} className="flex-shrink-0 bg-white font-bold text-xs px-4 py-2 rounded-xl hover:opacity-90 transition-colors active:scale-95" style={{color:accent}}>Vào học →</button>
            </div>
          )}
          {completed&&(
            <div className="bg-black/20 px-6 py-3 flex items-center justify-between">
              <p className="text-white font-semibold text-sm">🎓 Bạn đã hoàn thành khoá học!</p>
              <button onClick={onCert} className="flex-shrink-0 bg-white font-bold text-xs px-4 py-2 rounded-xl hover:opacity-90 active:scale-95" style={{color:accent}}>Nhận chứng chỉ →</button>
            </div>
          )}
        </div>

        {/* modules */}
        {mods.map(mod=>{
          const ml=mod.lessons;
          const mdone=ml.filter(l=>progress[l.id]).length;
          const isExp=expanded===mod.id;
          return(
            <div key={mod.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden card-lift">
              <button onClick={()=>setExpanded(isExp?null:mod.id)} className="w-full flex items-center gap-4 px-5 py-4 text-left hover:bg-gray-50 transition-colors">
                <span className="text-2xl flex-shrink-0">{mod.icon}</span>
                <div className="flex-1 min-w-0">
                  <p className="font-semibold text-gray-900 text-sm leading-snug">{mod.title}</p>
                  <div className="flex items-center gap-2 mt-1.5">
                    <div className="flex-1"><PBar val={mdone} max={ml.length} color={accent} h={5}/></div>
                    <span className="text-xs text-gray-400 flex-shrink-0">{mdone}/{ml.length}</span>
                  </div>
                </div>
                <span className="text-gray-400 flex-shrink-0 text-sm">{isExp?'▲':'▼'}</span>
              </button>
              {isExp&&(
                <div className="border-t border-gray-100">
                  {ml.map((lesson,li)=>{
                    const unlocked=isUnlocked(lesson.id,progress,courseId);
                    const lDone=!!progress[lesson.id];
                    const isCurrent=!lDone&&unlocked;
                    return(
                      <button key={lesson.id} onClick={()=>unlocked&&onLesson(lesson)} disabled={!unlocked}
                        className={`lesson-item w-full flex items-center gap-4 px-5 py-3.5 text-left border-b border-gray-50 last:border-0 ${unlocked?'cursor-pointer':'opacity-40 cursor-not-allowed'} ${isCurrent?'bg-rni-50/50':''}`}>
                        <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border-2 transition-all ${lDone?'text-white':`text-gray-400 border-gray-300 bg-white`}`} style={lDone?{background:accent,borderColor:accent}:isCurrent?{borderColor:accent,color:accent,background:`${accent}10`}:{}}>
                          {lDone?'✓':!unlocked?'🔒':li+1}
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className={`text-sm font-medium leading-snug truncate ${lDone?'text-gray-400 line-through':isCurrent?'font-semibold':'text-gray-700'}`} style={isCurrent?{color:accent}:{}}>{lesson.title}</p>
                          {isCurrent&&<p className="text-xs mt-0.5" style={{color:accent}}>Tiếp tục →</p>}
                        </div>
                        {unlocked&&!lDone&&<span className="text-gray-300 flex-shrink-0">›</span>}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}

        {completed&&(
          <button onClick={onCert} className="w-full py-4 rounded-2xl font-semibold text-white text-sm shadow-lg transition-all active:scale-95" style={{background:'linear-gradient(135deg,#f59e0b,#d97706)'}}>
            🎓 Nhận chứng chỉ hoàn thành
          </button>
        )}

        {/* upsell at bottom of dashboard */}
        {(() => {
          const items = UPSELL.filter(u => u.courses.includes(courseId)).slice(0, 3);
          if(!items.length) return null;
          return (
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
              <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Khám phá thêm từ RNI</p>
              <div className="space-y-3">{items.map(u=><UpsellCard key={u.id} product={u}/>)}</div>
            </div>
          );
        })()}

        <div className="text-center py-4 border-t border-gray-100">
          <p className="text-xs text-gray-400"><span className="font-semibold text-rni-600">Học viện RNI</span> · Return · Nurture · Illuminate</p>
          <p className="text-xs text-gray-300 italic mt-1">"Mỗi người đều mang trong mình một ngọn sáng."</p>
        </div>
      </div>

      <ChatButton/>
    </div>
  );
}

/* ─── ZALO CERT SCREEN ─────────────────────────────────────────── */

  const [showZalo,setShowZalo]=useState(false);
  const course=COURSES[courseId];
  const accent=course?.accent||'#9b1106';
  const upsellBottom=UPSELL.filter(u=>u.courses.includes(courseId)).slice(0,3);

  if(step==='survey'){
    return(
      <div className="min-h-screen bg-gray-50">
        <div className="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-20">
          <div className="max-w-2xl mx-auto flex items-center gap-3">
            <button onClick={()=>setStep('intro')} className="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">←</button>
            <h2 className="font-heading font-black text-base text-gray-900">Bản tự vấn chiêm nghiệm</h2>
          </div>
        </div>
        <div className="max-w-2xl mx-auto px-4 py-6">
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-5">
            <div className="text-center mb-5">
              <div className="text-4xl mb-3">🌸</div>
              <h3 className="font-heading font-black text-xl text-gray-900 mb-2">Bản tự vấn định vị</h3>
              <p className="text-gray-500 text-sm leading-relaxed">
                Mỗi hành trình chuyển hóa đều cần một điểm khởi đầu trung thực. Bản tự vấn dưới đây được thiết kế để giúp bạn soi rọi lại mức độ sẵn sàng của nội tâm sau những bài học vừa qua.
              </p>
              <p className="text-gray-400 text-sm mt-3 leading-relaxed">
                Dựa trên những chia sẻ này, đội ngũ phụng sự RNI sẽ cùng chiêm nghiệm để tìm ra phương thức đồng hành phù hợp nhất với chặng đường tiếp theo của bạn.
              </p>
            </div>
            <div className="rounded-2xl overflow-hidden border border-gray-200" style={{height:600}}>
              <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe-XUcJUh8RAbL4c8uT6/viewform?embedded=true" width="100%" height="600" frameBorder="0" marginHeight="0" marginWidth="0" title="Khảo sát RNI">Đang tải…</iframe>
            </div>
            <button onClick={()=>setStep('community')} className="w-full mt-5 py-3.5 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>
              Hoàn tất khảo sát để nhận lộ trình phù hợp →
            </button>
          </div>
        </div>
      </div>
    );
  }

  if(step==='community'){
    return(
      <div className="min-h-screen bg-gray-50">
        <div className="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-20">
          <div className="max-w-2xl mx-auto flex items-center gap-3">
            <div className="w-9 h-9"/>
            <h2 className="font-heading font-black text-base text-gray-900">Cộng đồng của bạn</h2>
          </div>
        </div>
        <div className="max-w-2xl mx-auto px-4 py-6 space-y-5">
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-7 text-center">
            <div className="text-5xl mb-4">💗</div>
            <h3 className="font-heading font-black text-xl text-gray-900 mb-3">Cảm ơn bạn đã dành thời gian tĩnh lặng để trung thực với chính mình.</h3>
            <p className="text-gray-500 text-sm leading-relaxed mb-6">Đội ngũ phụng sự sẽ dành thời gian đọc kỹ những chia sẻ của bạn và tìm ra cách đồng hành phù hợp nhất.</p>
            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5 mb-5 text-left">
              <p className="font-semibold text-gray-800 mb-2">🌻 Tham gia cộng đồng Đánh Thức Viên Ngọc Trong Bạn</p>
              <p className="text-gray-500 text-sm leading-relaxed mb-4">Nơi để bạn nuôi dưỡng hành trình và nhận những tài liệu, chia sẻ giá trị từ Ruby Nguyễn và cộng đồng.</p>
              <a href="https://www.facebook.com/groups/767075350423065" target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-2 py-3 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95" style={{background:'linear-gradient(135deg,#1877f2,#0d5bcc)'}}>
                <span>👥</span> Tham gia cộng đồng ngay
              </a>
            </div>
            <button onClick={onDone} className="w-full py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm hover:border-gray-300 transition-all">
              Về tổng quan khoá học
            </button>
          </div>

          {/* upsell bottom */}
          {upsellBottom.length>0&&(
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
              <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Tiếp tục hành trình với RNI</p>
              <div className="space-y-3">{upsellBottom.map(u=><UpsellCard key={u.id} product={u}/>)}</div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // intro step
  return(
    <div className="min-h-screen bg-gray-50">
      <div className="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-20">
        <div className="max-w-2xl mx-auto flex items-center gap-3">
          <button onClick={onBack} className="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">←</button>
          <h2 className="font-heading font-black text-base text-gray-900">Hoàn thành khoá học</h2>
        </div>
      </div>
      <div className="max-w-2xl mx-auto px-4 py-8">
        <div className="text-center mb-7 bounce-in">
          <div className="text-5xl mb-3 float">🎓</div>
          <h1 className="font-heading font-black text-2xl text-gray-900 mb-1">Chúc mừng, {userName}!</h1>
          <p className="text-gray-500 text-sm">Bạn đã hoàn thành khoá học<br/><strong>{course?.title}</strong></p>
        </div>

        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-5">
          <h3 className="font-semibold text-gray-800 mb-3">🏆 Nhận chứng chỉ hoàn thành</h3>
          <p className="text-gray-500 text-sm leading-relaxed mb-4">
            Để nhận chứng chỉ, bạn hãy nhấn nút bên dưới để kết nối với Zalo OA của RNI. Sau khi nhấn <strong>Quan tâm</strong>, Zalo OA sẽ tự động gửi chứng chỉ hoàn thành cho bạn.
          </p>
          <button onClick={()=>setShowZalo(true)} className="w-full py-3.5 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95" style={{background:'linear-gradient(135deg,#00b14f,#009a3e)'}}>
            🎖 Nhận chứng chỉ qua Zalo
          </button>
        </div>

        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-5">
          <h3 className="font-semibold text-gray-800 mb-2">🌸 Bước tiếp theo của bạn</h3>
          <p className="text-gray-500 text-sm leading-relaxed mb-4">Trước khi kết thúc, hãy dành vài phút để điền bản tự vấn chiêm nghiệm — để đội ngũ RNI hiểu bạn hơn và đồng hành phù hợp nhất.</p>
          <button onClick={()=>setStep('survey')} className="w-full py-3.5 rounded-xl text-white font-semibold text-sm shadow-md transition-all active:scale-95" style={{background:`linear-gradient(135deg,${accent},#c41a0a)`}}>
            Điền bản tự vấn →
          </button>
        </div>

        {/* upsell */}
        {upsellBottom.length>0&&(
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Khám phá thêm từ RNI</p>
            <div className="space-y-3">{upsellBottom.map(u=><UpsellCard key={u.id} product={u}/>)}</div>
          </div>
        )}
      </div>

      {/* Zalo popup */}
      {showZalo&&(
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 px-4" onClick={()=>setShowZalo(false)}>
          <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-7 text-center zalo-popup" onClick={e=>e.stopPropagation()}>
            <div className="text-4xl mb-3">📱</div>
            <h3 className="font-heading font-black text-xl text-gray-900 mb-2">Nhận chứng chỉ qua Zalo</h3>
            <p className="text-gray-500 text-sm leading-relaxed mb-5">
              Nhấn nút bên dưới để truy cập Zalo OA của RNI.<br/>
              Nhấn <strong>Quan tâm</strong> — Zalo OA sẽ tự động gửi chứng chỉ cho bạn ngay sau đó.
            </p>
            <div className="bg-green-50 border border-green-200 rounded-xl px-4 py-3 mb-5 text-sm text-green-700">
              🔒 Toàn bộ quá trình diễn ra trong giao diện này — bạn không cần rời khỏi trang web.
            </div>
            <div className="rounded-xl overflow-hidden mb-4" style={{height:400}}>
              <iframe src="https://zalo.me/4096198069463501502" width="100%" height="400" frameBorder="0" title="Zalo OA RNI"/>
            </div>
            <button onClick={()=>setShowZalo(false)} className="w-full py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm hover:border-gray-300 transition-all">
              Đóng
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── APP ──────────────────────────────────────────────────────── */
function App(){
  const [screen,setScreen]=useState('preQuiz');
  const [userName,setUserName]=useState('');
  const [quizResult,setQuizResult]=useState(null);
  const [courseId,setCourseId]=useState(null);
  const [lesson,setLesson]=useState(null);
  const [progress,setProgress]=useState(()=>{try{return JSON.parse(localStorage.getItem('rni-progress')||'{}');}catch{return{};}});

  useEffect(()=>{try{localStorage.setItem('rni-progress',JSON.stringify(progress));}catch{}},[progress]);
  useEffect(()=>{
    try{
      const n=localStorage.getItem('rni-name');
      const c=localStorage.getItem('rni-course');
      if(n&&c){setUserName(n);setCourseId(c);setScreen('dashboard');}
    }catch{}
  },[]);

  const done=(id)=>setProgress(p=>({...p,[id]:true}));
  const reset=()=>{try{localStorage.removeItem('rni-name');localStorage.removeItem('rni-course');localStorage.removeItem('rni-email');}catch{}setScreen('preQuiz');setUserName('');setCourseId(null);setProgress({});};

  if(screen==='preQuiz')return <PreQuizScreen onStart={()=>setScreen('quizTransition')}/>;
  if(screen==='quizTransition')return <QuizTransition onDone={()=>setScreen('quiz')}/>;
  if(screen==='quiz')return <QuizScreen onDone={r=>{setQuizResult(r);setCourseId(r);setScreen('quizLoading');}}/>;
  if(screen==='quizLoading')return <QuizLoading onDone={()=>setScreen('quizResult')}/>;
  if(screen==='quizResult')return <QuizResultScreen result={quizResult} onContinue={()=>setScreen('register')}/>;
  if(screen==='register')return <RegisterScreen courseId={courseId} onDone={(n,e)=>{setUserName(n);try{localStorage.setItem('rni-name',n);localStorage.setItem('rni-email',e);localStorage.setItem('rni-course',courseId);}catch{}setScreen('welcome');}}/>;
  if(screen==='welcome')return <WelcomeScreen userName={userName} courseId={courseId} onStart={()=>setScreen('dashboard')}/>;
  if(screen==='cert')return <CertScreen userName={userName} courseId={courseId} onBack={()=>setScreen('dashboard')} onDone={()=>setScreen('dashboard')}/>;
  if(screen==='lesson'&&lesson)return <LessonView lesson={lesson} progress={progress} courseId={courseId} onComplete={done} onBack={()=>{setLesson(null);setScreen('dashboard');}}/>;
  return <Dashboard userName={userName} courseId={courseId} progress={progress} onLesson={l=>{setLesson(l);setScreen('lesson');}} onCert={()=>setScreen('cert')}/>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
