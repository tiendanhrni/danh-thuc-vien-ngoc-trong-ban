  {id:1,part:1,q:"Tu khoa nao mo ta dung nhat ve tinh trang noi tam cua ban hien tai?",opts:["Chong chenh, trong rong va kiet que cam xuc du be ngoai van on.","Dang tap quay ve ben trong, co luc binh an nhung doi khi van bi ngoai canh lam dao dong.","Vung chai, tinh tai va san sang lan toa nang luong binh an nay den nhung nguoi xung quanh."]},
  {id:2,part:1,q:"Thach thuc lon nhat ma ban dang phai doi dien luc nay la gi?",opts:["Khong biet minh thuc su muon gi, cam thay lac loi va mat niem tin vao chinh minh.","Biet minh can thay doi nhung chua duy tri duoc thoi quen tinh thuc, can su dong hanh de khong bo cuoc.","Dang lam nghe giup nguoi nhung thieu he thong chuan de dong goi gia tri va tao tac dong sau rong hon."]},
  {id:3,part:1,q:"Khi gap mot van de kho khan, phan ung thuong thay nhat cua ban la:",opts:["Cam thay so hai, be tac va lap tuc di tim giai phap nhanh hoac loi khuyen tu nguoi khac.","Dang tap xem van de la bai hoc, dung 'than chu' tinh tam nhung thinh thoang van bi cuon theo cam xuc.","Binh than don nhan, tu lam viec sau chinh minh va xem do la co hoi de nang tam tu duy."]},
  {id:4,part:1,q:"Trai nghiem cua ban doi voi cac giai phap phat trien ban than truoc day ra sao?",opts:["Thuong mua cac khoa hoc hua hen thanh cong nhanh, nhung sau do lai thay kiet suc nhu 'uong nuoc muoi khi khat'.","Da hoc nhieu kien thuc sau sac nhung chi dung o be noi, biet kien thuc nhung chua thuc su 'song' duoc voi no.","Da chuyen hoa manh me, hien dang ung dung tot nhung muon chuan hoa de co the giup do nguoi khac."]},
  {id:5,part:2,q:"Chat luong cuoc doi thoai noi tam (Self-talk) cua ban moi ngay dien ra nhu the nao?",opts:["Thuong xuyen tu phan xet, trach moc va tu nhu 'minh khong the', 'minh khong du gioi'.","Dang nhan dien duoc nhung suy nghi tu pha hoai va co gang dung tu chiem nghiem de chuyen doi chung.","Hoan toan lam chu tam tri, biet cach tu chiem nghiem va nuoi duong niem tin vung chac vao ban than."]},
  {id:6,part:2,q:"Khi mot nguoi than hoac ban be tim den ban de tam su van de cua ho, ban thuong lam gi?",opts:["Lap tuc dua ra goc nhin, loi khuyen va chi cho ho cach giai quyet theo y minh.","Co gang lang nghe nhieu hon, han che khuyen bao nhung doi luc van bi phan xet hoac dong khung van de.","Lang nghe rong lang, khong gia dinh va dung cau hoi chat luong de khai mo tri tue cho ho tu tim cau tra loi."]},
  {id:7,part:2,q:"Khat khao cot loi cua ban doi voi viec giup do nguoi khac la gi?",opts:["Luc nay toi chi muon giai quyet van de ca nhan va tim thay su binh yen cho rieng minh truoc.","Toi muon giup gia dinh, dong nghiep hoac doi nhom cua minh tot len nhung lo so ban than chua du nang luc.","Viec phung su cuoc doi la su menh lon nhat cua toi, toi muon dong hanh cung su phat trien cua con nguoi."]},
  {id:8,part:2,q:"Muc do tin tuong cua ban vao 'tri tue ben trong' cua chinh minh?",opts:["Rat thap. Toi thuong xuyen do du truoc moi quyet dinh va phu thuoc vao y kien nguoi khac.","Dang cai thien. Toi da bat dau lang nghe truc giac nhung thinh thoang van hoai nghi ban than.","Tuyet doi. Toi co mot niem tin khong lay chuyen rang moi cau tra loi toi can deu co san o ben trong."]},
  {id:9,part:3,q:"Neu duoc lua chon mot vai tro tuong lai cho ban than, ban muon huong toi dieu gi nhat?",opts:["Mot nguoi binh thuong song vui ve, can bang, khong con cang thang hay ap luc.","Mot nguoi lanh dao/cha me/quan ly biet ung dung su tinh thuc de lam viec hieu qua va hoa hop hon.","Mot nguoi kien tao di san mang gia tri minh co phung su cuoc doi."]},
  {id:10,part:3,q:"Dong luc nao thuc day ban tim den su dong hanh cua RNI luc nay?",opts:["Tim kiem su thau hieu, mot huong di de thoat khoi nhung vong lap be tac hien tai.","Tim kiem mot moi truong phu hop de hoc tap, vun boi, ham duong noi tai.","Tim kiem mot nen tang giao duc chuan quoc te de toa sang, trao gia tri va dong hanh kien tao cong dong lon."]},
  {id:11,part:3,q:"Ban san sang cam ket nhu the nao cho su phat trien ban than trong giai doan toi?",opts:["Co the tham gia cac khoa hoc ngan han hoac cac buoi workshop mo rong nhan thuc.","Cam ket thoi gian thuc hanh moi ngay va tham gia lo trinh chuyen sau de tu chuyen hoa ban than.","Cam ket cao do (dau tu tai chinh, thoi gian, tam huyet) de hoc hoi ky nang va nhan chung chi quoc te."]},
  {id:12,part:3,q:"Hien tai, ban dinh nghia nhu the nao ve khai niem 'Khai van' (Coaching)?",opts:["La mot dich vu ma nguoi Coach se tu van va giai quyet triet de van de cho toi.","La cong cu giup toi doi thoai voi noi tam, nang tam tu duy va lam chu cam xuc.","La mot su menh di vao tam tri nguoi khac, khoi goi nhan thuc bang nhung nang luc cot loi theo chuan toan cau."]}
];

  R:{stage:"Tro Ve",subtitle:"Return \u2014 Tim lai chinh minh",icon:"*",accent:"#78533a",gradFrom:"#fef3e8",gradTo:"#fdfbf7",border:"#e8d5c0",

    opening:"Ban thuong men,\n\nCo mot thuc tai lang le ma co le ban dang cam nhan rat ro: ben ngoai va ben trong ban duong nhu khong con noi cung mot ngon ngu.\n\nBan van buoc di moi ngay, van hoan thanh moi vai tro mot cach 'tam on'. Nhung trong nhung khoang lang hiem hoi, mot cau hoi bong hien len nhuc nhoi: 'Minh dang thuc su song, hay chi dang loay hoay de ton tai cho dung kich ban cua cuoc doi?'.\n\nXin hay hieu rang, cam giac trong trai hay hoang mang ay khong phai la mot 'loi sai', cung khong phai la su yeu duoi. Do chinh la khoang khac 'bung tinh'. La tieng goi tu ban the chan thuc dang thuc giuc ban tim ve mot hien thuc sau sac va chan that hon nhung gi dang hien lo.\n\nLuc nay, dieu ban can khong phai la chat them vao ba lo nhung thong tin hay nhung ke hoach vi dai moi. Thu ban thuc su can la dung khi de thuc hien mot 'Phep Tru' cho tam hon.\n\nDe duoc dung lai va thoi chay tron khoi chinh minh.\nDe duoc thay ro nhung gia tri cot loi dang bi che lap boi ky vong cua so dong.\nDe thuc hien cuoc thien di lon nhat doi nguoi: tro ve danh thuc vien ngoc quy von da luon o do, san sang de toa rang tu ben trong ban.\n\n'Cuoc doi that dep khong phai khi no hoan hao, ma khi du khong hoan hao, ta van co the binh than don nhan va song dung voi ban the chan that cua minh.'\n\nKhi ban chon buoc di de tim lai soi day ket noi ay, con duong moi se tu khac mo ra duoi chan ban.",

        {id:'N-1-3',title:'Thap sang lai ngon hai dang ben trong',desc:'Trang bi cho ban dung khi de doi dien voi chinh minh, thau hieu gia tri cot loi tu nhung vung toi.',videoId:'uN_8IYPq43Y',
          quiz:[
            {q:'Theo nguyen ly "Dam di vao bong toi", nhung cam xuc "tieu cuc" nen duoc nhin nhan nhu the nao?',opts:['La van de can phai xoa bo ngay lap tuc.','La nhung su gia trung thuc dan ban ve voi he gia tri song cua chinh minh.','La dau hieu cua su yeu duoi can che day.'],correct:1},
            {q:'"Trach nhiem tuyet doi" nghia la gi?',opts:['Tu trach ban than ve nhung sai lam qua khu.','Chuyen vi tri tu nan nhan sang nguoi kien tao, chon cach phan ung voi nhung gi xay ra.','Phu nhan nhung ton thuong da qua.'],correct:1},
            {q:'Y nghia cua nguyen ly "Dam mot minh" trong viec tim lai chinh minh la gi?',opts:['Cat dut moi ket noi xa hoi de song cuoc doi co doc.','Dam rut khoi tieng on ben ngoai de lang nghe tri tue ben trong cat tieng.','Chung to su manh me va khong can su giup do cua bat ky ai.'],correct:1},
            {q:'Tai sao "noi toi nhat cung la noi anh sang toa rang nhat"?',opts:['Vi nhung gia tri cot loi thuong lo dien khi ta dam quan sat nhung cam xuc kho chiu von bi ne tranh.','Vi bong toi la ke thu can phai bi tieu diet bang anh sang tich cuc.','Vi chi khi roi vao dau kho cung cuc con nguoi moi co dong luc thay doi.'],correct:0}
          ],
          practice:{type:'journal',prompt:'Bat dau tu hom nay, moi khi co cam xuc kho chiu, hay dung lai va hoi: "Gia tri nao cua toi dang bi cham vao o day?" va ghi chep lai.',placeholder:'Cam xuc kho chiu toi dang co:\n\nGia tri dang bi cham vao:\n\nThong diep cam xuc nay muon noi voi toi:\n'}},
        {id:'N-1-4',title:'Tram soi sang - Dinh',desc:'Giup ban khong con bi loi keo boi nhung ky vong ben ngoai, tu do xac dinh huong di dung dan.',videoId:'8MKYtuRPyWM',
          quiz:[
            {q:'Su khac biet lon nhat khi "Trai tim lam la ban" so voi "Noi so cam lai" la gi?',opts:['Trai tim hua hen mot con duong de dang hon.','Nguoi di bang noi so can ly do de tiep tuc, nguoi di bang trai tim thi chinh con duong da la ly do.','Noi so khong bao gio su dung ly tri de nguy trang.'],correct:1},
            {q:'"Muc tieu tu trai tim" (Heart Goals) duoc nhan dien qua dau hieu nao?',opts:['Khi nghi ve no, ban thay nang tri nhung biet la "nen lam".','Khi nghi ve no, tim ban am len hoac sang len, du co the di kem mot chut so hai.','Do la muc tieu ma dam dong cho la dung va dep.'],correct:1},
            {q:'Lam the nao de nhan dien khi "Noi so dang cam lai" cuoc doi ban?',opts:['Khi ban cam thay luoi bieng va khong muon lam gi ca.','Khi ban van rat cham chi nhung moi buoc di deu nang ne va noi so luon nguy trang bang nhung ly do "hop ly".','Khi ban gap qua nhieu rui ro va bien co trong cong viec.'],correct:1},
            {q:'Bai hoc lon nhat tu cau chuyen Odysseus va tieng hat Siren la gi?',opts:['DINH khong phai la khong so, ma la biet minh di dau va co phuong cach bao ve huong di khi noi so dang cao.','Muon ve dich thi phai bit tai truoc moi loi gop y cua nhung nguoi xung quanh.','Chi nhung nguoi anh hung moi co the chien thang duoc nhung cam do cua cuoc doi.'],correct:0}
          ],
          practice:{type:'journal',prompt:'Kiem tra muc tieu (Heart Goals): Chon mot muc tieu quan trong hien tai va cham diem tu 1-10: Khi nghi ve no, tim ban am len hay nang tri? Neu khong ai biet den, ban con muon lam khong?',placeholder:'Muc tieu toi muon kiem tra:\n\nKhi nghi ve no, toi cam thay (1-10):\n\nNeu khong ai biet, toi co con muon lam khong?\n\nDay co thuc su la Heart Goal cua toi khong?\n'}},
        {id:'N-1-5',title:'Tram soi sang - Tinh',desc:'Huong dan cach tinh gian de tao khong gian cho nhung gia tri cot loi xuat hien.',videoId:'8MKYtuRPyWM',
          quiz:[
            {q:'Muc dich cot loi cua viec "Tinh gian" trong thiet ke cuoc doi la gi?',opts:['Bo het tat ca moi thu de song toi gian.','Giu lai nhung gi cot loi nhat de tao khong gian cho cac gia tri thuc su xuat hien.','De chung minh minh la nguoi song tiet kiem.'],correct:1},
            {q:'Ban thuong cam thay kiet suc vi ly do gi theo nguyen ly "Tinh"?',opts:['Vi ban khong du cham chi.','Vi ban mang theo qua nhieu thu khong can thiet hoac da het han su dung.','Vi ban chua co du cac thiet bi cong nghe hien dai.'],correct:1},
            {q:'Tai sao "Hieu biet ma khong hanh dong" lai la van de cua 90% moi nguoi?',opts:['Vi ho thieu mot he thong giup bien nhan thuc thanh hanh dong va mot moi truong nang do du manh.','Vi kien thuc ho hoc duoc chua thuc su hay va thuc te.','Vi ho chua co du quyet tam va no luc ca nhan.'],correct:0},
            {q:'Tinh trang "biet nhieu nhung khong tieu hoa duoc" dan den he qua gi?',opts:['Giup ho tro nen thong thai va co nhieu kien thuc hon nguoi khac.','Tro thanh nan nhan cua su thua thai, gay ra su met moi noi tam va hoang mang hon ca luc chua hoc.','Kich thich nao bo hoat dong nhanh hon de tim ra cac giai phap moi.'],correct:1}
          ],
          practice:{type:'journal',prompt:'Chiec vali cuoc doi: Tuong tuong ban chi duoc mang mot chiec vali 10kg cho hanh trinh nam toi. Hay viet ra 3 thu (thoi quen, moi quan he, hoac noi dau cu) ban se loai bo ngay.',placeholder:'Thu toi muon loai bo khoi chiec vali cuoc doi:\n1.\n2.\n3.\n\nCam giac toi khi tuong tuong minh da buong bo duoc nhung dieu do:\n'}},
        {id:'N-1-6',title:'Tram soi sang - Du',desc:'Giup ban thiet ke mot cuoc song du day, noi thanh cong khong phai tra gia bang su kiet que.',videoId:'sW9UOWfZiFg',
          quiz:[
            {q:'Chu "DU" trong bai hoc duoc hieu la:',opts:['Co that nhieu tien bac va thanh tuu.','Khi nhung manh ghep quan trong cua doi song deu duoc nhin thay, cham soc va can bang.','Dung lai hoan toan va khong con khao khat gi nua.'],correct:1},
            {q:'Khi mot nguoi dung su nghiep de bu dap cho su bat an noi tam, ho dang vi pham nguyen ly nao?',opts:['Nguyen ly "Tinh".','Nguyen ly "Du" (song lech, dung manh nay bu cho manh khac).','Nguyen ly "Dinh".'],correct:1},
            {q:'Chien thuat "dat muc tieu cuc nho trong 30 ngay" cho mot manh "vang" hoac "do" nham muc dich:',opts:['Thay doi hoan toan cuc dien khia canh do ngay lap tuc.','Bat dau qua trinh cham soc lai cac gia tri bi bo quen mot cach nhe nhang va ben vung.','De thu nghiem xem khia canh do co thuc su quan trong voi minh khong.'],correct:1},
            {q:'Khi doi dien voi mot "manh do" (khia canh dang dau hoac bat on), hoc vien nen lam gi?',opts:['Dat ra mot muc tieu hoanh trang de thay doi hoan toan cuc dien ngay lap tuc.','Chap nhan su that va tam thoi phot lo no de tap trung vao nhung manh dang xanh.','Dat mot muc tieu rat nho trong 30 ngay de bat dau cham soc lai no mot cach nhe nhang.'],correct:2}
          ],
          practice:{type:'journal',prompt:'Quet 10 khia canh: Danh gia 10 khia canh cuoc doi (suc khoe, gia dinh, su nghiep, tai chinh, ban be, ban than, hoc hoi, giai tri, dong gop, tinh than). Chon ra mot "manh do" hoac "manh vang" va dat mot muc tieu nho de cham soc no trong 30 ngay toi.',placeholder:'Danh gia 10 khia canh (1-10):\nSuc khoe: /10\nGia dinh: /10\nSu nghiep: /10\nTai chinh: /10\nBan be: /10\nBan than: /10\nHoc hoi: /10\nGiai tri: /10\nDong gop: /10\nTinh than: /10\n\nManh toi chon cham soc:\nMuc tieu nho trong 30 ngay:\n'}},
        {id:'N-1-7',title:'Tram soi sang - Hien',desc:'Kham pha nguyen ly su song la mot dong chay cho - nhan.',videoId:'Ngbb_ZmAB3c',
          quiz:[
            {q:'Trang thai "HIEN" tang dung nghia xuat phat tu dau?',opts:['Khi cam thay minh da hoan hao va cuc ky thanh cong.','Khi noi tam du day, viec trao di tro thanh mot su tuan chay tu nhien nhu ban chat cua cay xanh hay mat troi.','Khi bi bat buoc boi cac nghia vu dao duc.'],correct:1},
            {q:'Lam sao de nhan dien "mon qua tu nhien" cua ban de hien tang cho doi?',opts:['Quan sat dieu ban lam ma quen ca thoi gian va dieu nguoi khac thuong tim den ban de nho va.','Chon nhung viec kho nhat ma khong ai muon lam.','Doi den khi hoan hao va cuc ky thanh cong moi bat dau trao di.'],correct:0},
            {q:'Tai sao trao di tu su "du day" lai khong lam con nguoi kiet suc?',opts:['Vi cong hien luc nay la mot su tuan chay tu nhien cua tinh thuong va su biet on, khong phai nghia vu.','Vi nguoi trao di se nhan lai duoc su ton trong va tien bac tuong ung.','Vi trao di giup chung ta quen di nhung noi dau cua chinh minh.'],correct:0},
            {q:'Su khac biet giua "Hien" tang chan that va su "Hy sinh" gong minh la gi?',opts:['Hy sinh mang lai ket qua lon hon, trong khi hien tang chi mang tinh ca nhan.','Hien tang la de ban duoc song dung ban chat tu nhien (nhu cay xanh cho bong mat), khong phai su no luc ep buoc.','Hien tang chi danh cho nguoi giau, con hy sinh danh cho tat ca moi nguoi.'],correct:1}
          ],
          practice:{type:'journal',prompt:'Tim kiem mon qua tu nhien: Tra loi cau hoi: "Dieu gi toi lam ma quen ca thoi gian?" va "Nguoi khac thuong tim den toi vi dieu gi?". Hay danh mot khoang thoi gian trong tuan de thuc hien dieu do cho ai do ma khong muu cau nhan lai.',placeholder:'Dieu toi lam ma quen ca thoi gian:\n\nNguoi khac thuong tim den toi vi:\n\nToi se trao di dieu nay cho ai, vao khi nao:\n'}},
        {id:'N-1-8',title:'Thiet ke chang tiep theo ruc ro',desc:'Pha vo "quan tinh song" va trang thai "tam on" nguy hiem.',videoId:'l9BFYnB49Es',
          quiz:[
            {q:'Su khac biet giua "Nguyen" va "Muc tieu" la gi?',opts:['Muc tieu huong ve ket qua tuong lai; Nguyen huong ve cach ban hien dien trong tung khoang khac.','Nguyen co the thay doi lien tuc, muc tieu thi khong.','Ca hai deu chi tap trung vao nhung gi ta muon dat duoc.'],correct:0},
            {q:'Tai sao ta nen chon "Ba tru cot" thay vi co gang can bang tat ca?',opts:['Vi ta khong du kha nang lam nhieu viec.','De tranh song dan trai va chap nhan su khong hoan hao o nhung mang khac de tap trung vao dieu thiet yeu nhat.','Vi ba luon la con so hoan hao trong moi linh vuc.'],correct:1},
            {q:'Bai hoc ve "cam re sau" va "no hoa" cua cai cay day chung ta dieu gi?',opts:['Chung ta phai co gang no hoa that nhanh de chung minh gia tri cua minh.','Moi chang doi co mot trong tam rieng; ta khong the vua cam re sau de vun boi noi luc vua doi hoi minh phai bung no hoa ruc ro cung luc.','Chi nhung nguoi co goc re vung chac moi xung dang duoc cong nhan thanh cong.'],correct:1},
            {q:'Suc manh thuc su cua viec "Chon Nguyen" la gi?',opts:['No giup ban nhanh chong dat duoc nhung danh xung va su cong nhan tu xa hoi.','No khong dua ban di xa hon nguoi khac, nhung no dua ban ve dung voi chinh minh va giup ban dung vung ngay trong hien tai.','No thay the hoan toan cho cac muc tieu thuc te de ban song mot cuoc doi mo mong hon.'],correct:1}

        {id:'N-1-9',title:'Thuc hanh song y nghia moi ngay',desc:'Suc manh cua Hanh dong sieu nho trong viec hinh thanh nep song moi.',videoId:'xxKa0iw4j0Y',
          quiz:[
            {q:'Tai sao nhung "Hanh dong sieu nho" lai co suc manh lon trong viec thay doi cuoc doi?',opts:['Vi chung khong kich hoat su chong cu cua nao bo va de dang tro thanh nep song.','Vi chung mang lai ket qua bung no ngay lap tuc.','Vi chung yeu cau ky luat thep de thuc hien.'],correct:0},
            {q:'"Ranh gioi" duoc thiet lap nham muc dich gi?',opts:['De day nguoi khac ra xa va song ich ky.','De che chan "ngon den" nep song moi truoc nhung "ngon gio" cua ky vong, thoi quen cu va su qua tai.','De kiem soat nguoi khac khong lam phien ban.'],correct:1},
            {q:'Thiet lap "Ranh gioi voi chinh minh" co nghia la:',opts:['Luon trung phat ban than khi khong dat duoc ke hoach de ra.','Khong dung su met moi de bien minh cho viec quay lai quan tinh cu va luon quay ve voi Nguyen.','Tu choi moi so thich ca nhan de tap trung hoan toan vao cong viec.'],correct:1},
            {q:'Hanh dong sieu nho hieu qua nhat cho nep song sang la:',opts:['Thien 1 gio moi sang.','Danh 2 phut viet 1 dieu ban biet on va 1 y dinh cho ngay hom do.','Doc it nhat 50 trang sach moi ngay.'],correct:1}

  I:{id:'I',title:'Xay Dung Su Nghiep Y Nghia Mang Ten Ban',subtitle:'Giai doan Illuminate - Lan Toa',icon:'[I]',accent:'#9b1106',

          {id:'I-1-1',title:'Su thinh vuong ben ngoai va su can kiet ben trong',desc:'Bai hoc kham pha nghich ly cua thoi dai moi: khi con nguoi so huu day du tien nghi vat chat nhung lai kiet que ve noi tam.',videoId:'76rOAHAgwVo',
            quiz:[
              {q:'Ly do khien con nguoi hien dai du so huu nhieu vat chat nhung van cam thay trong rong la gi?',opts:['Do cong nghe phat trien qua nhanh.','Do thieu cac moi quan he xa hoi.','Do chi tap trung vao cac dieu kien ngoai canh va muc tieu ben ngoai ma quen mat viec nuoi duong tam hon.','Do khong co du kien thuc chuyen mon.'],correct:2},
              {q:'"Nghich ly" cua the gioi hien dai duoc mo ta nhu the nao?',opts:['Giau co ve tai san nhung ngheo nan ve tam hon; day du tien nghi nhung kiet que ve noi tam.','Co nhieu thoi gian nhung khong biet cach su dung hieu qua.','Lam viec it nhung muon dat duoc thanh qua lon.','Co qua nhieu su lua chon dan den viec khong the quyet dinh.'],correct:0},
              {q:'Ap luc tu nhung ky vong xa hoi va su so sanh khong ngung dan den tinh trang nao?',opts:['Su giau co ben vung ve tinh than.','Kha nang thich nghi tot hon voi moi truong.','Kiet que cam xuc, cang thang man tinh va mat ket noi voi chinh minh.','Su thang tien nhanh chong trong su nghiep.'],correct:2},
              {q:'Tai sao con nguoi hien dai du dat duoc nhieu thanh cong vat chat van thuong xuyen cam thay mat phuong huong?',opts:['Do toc do phat trien cong nghe qua cham.','Do luon huong ra ben ngoai de tim kiem su cong nhan thay vi nuoi duong noi tam.','Do khong du thoi gian de nghi ngoi.','Do thieu cac ky nang quan ly cong viec.'],correct:1}

            practice:{type:'journal',prompt:'Viet ra danh sach 3 thanh tuu ben ngoai ban da dat duoc va tu van xem cam giac hai long do keo dai trong bao lau. Sau do, liet ke 1 hoat dong giup ban cam thay binh an tu ben trong ma khong phu thuoc vao vat chat.',placeholder:'Thanh tuu 1: ...\n-> Cam giac hai long keo dai: ...\n\nThanh tuu 2: ...\n-> Cam giac hai long keo dai: ...\n\nThanh tuu 3: ...\n-> Cam giac hai long keo dai: ...\n\nHoat dong binh an tu ben trong:\n'}},
          {id:'I-1-2',title:'Cuoc khung hoang niem tin',desc:'Video nay phan tich sau ve "goc re" cua su bat on hien nay: su mat niem tin vao chinh minh va gia tri tu than.',videoId:'GSea5du0njI',
            quiz:[
              {q:'Dieu gi duoc coi la "goc re" cua cuoc khung hoang niem tin o con nguoi hien dai?',opts:['Su phan boi tu nhung nguoi xung quanh.','Su bien dong cua nen kinh te the gioi.','Mat niem tin vao chinh minh va gia tri tu than.','Thieu niem tin vao cac giai phap cong nghe moi.'],correct:2},
              {q:'Tai sao cac giai phap ben ngoai thuong khong giai quyet duoc su bat on noi tam?',opts:['Vi chung qua dat do.','Vi chung giong nhu "nuoc muoi", chi mang lai cam giac tam thoi va khien ta them kiet suc ve lau dai.','Vi chung khong cung cap du thong tin can thiet.','Vi xa hoi khong cong nhan cac giai phap do.'],correct:1},
              {q:'Dieu nguy hiem nhat trong "cuoc khung hoang niem tin" la gi?',opts:['Khong co du tai chinh de dau tu.','Tin vao nhung dieu sai lam nhu gia tri ban than phu thuoc vao so huu vat chat hoac y kien nguoi khac.','Thieu cac moi quan he xa hoi chat luong.','Mat niem tin vao cac giai phap cong nghe hien dai.'],correct:1},
              {q:'Goc re cua su binh an va hanh phuc thuc su nam o dau?',opts:['O su thay doi hoan hao cua hoan canh ben ngoai.','O viec duoc xa hoi cong nhan va ton vinh.','O trang thai noi tam va viec quay ve ben trong de nhan dien chinh minh.','O kha nang kiem soat moi bien dong cua cuoc song.'],correct:2}
            ],
            practice:{type:'journal',prompt:'Nhan dien 1 tinh huong gan day ban cam thay mat kiem soat. Thay vi di tim loi khuyen ngay lap tuc, hay danh 15 phut de "quay ve ben trong", quan sat trang thai noi tam cua minh luc do.',placeholder:'Tinh huong toi cam thay mat kiem soat:\n\nKhi toi "quay ve ben trong", toi nhan ra:\n\nTrang thai noi tam cua toi luc do la:\n\nDieu toi thuc su can luc nay:\n'}},
          {id:'I-1-3',title:'Khai van tinh thuc - con duong tro ve noi tam',desc:'Bai hoc tap trung vao viec nang tam tu duy va khoi day tri tue noi tai.',videoId:'9jmrTIGg6mM',
            quiz:[
              {q:'Trong hinh anh "cay co thu", yeu to nao quyet dinh kha nang dung vung truoc bao giong?',opts:['Nhung canh la vuon cao.','Tan bong ram rong lon.','Bo re dam sau va manh me vao long dat (noi tam).','Su cham soc tu moi truong ben ngoai.'],correct:2},
              {q:'Trai tim cua "Khai van tinh thuc" tai RNI tap trung vao muc tieu cot loi nao?',opts:['Cung cap cac cau tra loi dinh san cho khach hang.','Nuoi duong noi tam binh an, sang suot de lam chu cuoc song va khoi day tri tue noi tai.','Giai quyet nhanh cac van de thuc te truoc mat.','Xay dung mot ban do lo trinh su nghiep co dinh.'],correct:1},
              {q:'Khai van tinh thuc tap trung vao su phat trien toan dien nao cua mot nguoi Coach tai RNI?',opts:['Chi tap trung vao ky nang dat cau hoi.','Chi tap trung vao xay dung su nghiep kinh doanh.','Vun boi ban the nguoi Coach, ren luyen ky nang va xay dung su nghiep khai van.','Tap trung vao viec giai quyet moi van de thuc te cho khach hang.'],correct:2},

const getModules=(cId)=>COURSES[cId]?.modules||[];
const getAllLessons=(cId)=>getModules(cId).flatMap(m=>m.lessons.map(l=>({...l,moduleId:m.id,isQA:!!m.isQA,isStory:!!m.isStory})));
const isUnlocked=(lId,prog,cId)=>{const all=getAllLessons(cId);const i=all.findIndex(l=>l.id===lId);if(i===0)return true;return !!prog[all[i-1]?.id];};
const isCourseComplete=(prog,cId)=>{const all=getAllLessons(cId);const storyLesson=all.find(l=>l.isStory);return storyLesson?!!prog[storyLesson.id]:all.every(l=>!!prog[l.id]);};

function QuizScreen({onDone,onBack}){
  const [idx,setIdx]=useState(0);
  const [answers,setAnswers]=useState([]);
  const [sel,setSel]=useState(null);
  const [busy,setBusy]=useState(false);
  const q=QUIZ_QUESTIONS[idx];
  const partLabels={1:"Ban dang thay gi o chinh minh luc nay?",2:"Ban dang nuoi duong dieu gi ben trong?",3:"Ban dang huong ve dau?"};
  const partIntros={1:"Khong can suy nghi qua nhieu. Hay chon dieu gan voi ban nhat luc nay.",2:"Quan sat that nhe nhang - khong can danh gia ban than.",3:"Day la phan cuoi - hay de truc giac dan loi."};
  const isFirst=idx===0||QUIZ_QUESTIONS[idx-1].part!==q.part;

  const pick=(i)=>{
    if(busy)return;
    setSel(i);setBusy(true);
    setTimeout(()=>{
      const na=[...answers,i];
      setAnswers(na);setSel(null);setBusy(false);
      if(idx<QUIZ_QUESTIONS.length-1){setIdx(idx+1);}
      else{
        const c={0:0,1:0,2:0};na.forEach(a=>c[a]++);
        let r='R';
        if(c[2]>c[1]&&c[2]>c[0])r='I';
        else if(c[1]>c[0]&&c[1]>=c[2])r='N';
        else if(c[2]===c[1]&&c[2]>c[0])r='I';
        onDone(r);
      }
    },320);
  };

  return(
    <div className="min-h-screen flex flex-col hero-bg">
      <div className="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-20">
        <div className="max-w-lg mx-auto">
          <div className="flex items-center gap-3 mb-2">
            <button onClick={onBack} className="text-gray-400 hover:text-gray-700 text-sm font-medium transition-colors flex-shrink-0">&larr; Quay lai</button>

function Dashboard({userName,courseId,progress,onLesson,onCert,onRedo}){
  const [expanded,setExpanded]=useState(1);
  const course=COURSES[courseId];
  const mods=getModules(courseId);
  const all=getAllLessons(courseId);
  const r=QUIZ_RESULTS[courseId];
  const done=all.filter(l=>progress[l.id]).length;
  const total=all.length;
  const pct=Math.round(done/total*100);
  const next=all.find(l=>!progress[l.id]);
  const completed=isCourseComplete(progress,courseId);
  const accent=course?.accent||'#9b1106';

  return(
    <div className="min-h-screen bg-gray-50">
      <div className="bg-white border-b border-gray-100 px-4 py-4 sticky top-0 z-20">
        <div className="max-w-2xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <Logo size={38}/>
            <div>
              <p className="font-heading font-black text-sm text-gray-900 leading-tight line-clamp-1">{course?.title}</p>
              <p className="text-xs text-gray-400">{course?.subtitle}</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <button onClick={onRedo} className="text-xs text-gray-400 hover:text-rni-600 transition-colors font-medium whitespace-nowrap">&larr; Lam lai khao sat</button>
            <div className="text-right">
              <p className="text-xs font-bold" style={{color:accent}}>{pct}%</p>
              <p className="text-xs text-gray-400">{done}/{total} bai</p>
            </div>
          </div>
        </div>
      </div>
      <div className="max-w-2xl mx-auto px-4 py-5 space-y-5">
        <div className="rounded-2xl overflow-hidden shadow-sm" style={{background:`linear-gradient(135deg,${accent} 0%,${accent}cc 60%,#d97706 100%)`}}>
          <div className="px-6 py-5 text-white">
            <p className="text-sm opacity-80 mb-0.5">Xin chao,</p>
            <h2 className="font-heading font-black text-2xl mb-3">{userName} &#10022;</h2>
            <div style={{background:'rgba(255,255,255,.25)',borderRadius:999,height:8,overflow:'hidden',marginBottom:8}}>
              <div className="progress-bar" style={{width:`${pct}%`,height:'100%',background:'white',borderRadius:999}}/>
            </div>
            <div className="flex items-center justify-between">
              <p className="text-xs opacity-75">{done} / {total} bai hoc hoan thanh</p>
              <p className="text-xs font-bold">{pct}%</p>
            </div>
          </div>
          {!completed&&next&&(
            <div className="bg-black/20 px-6 py-3 flex items-center justify-between">
              <div><p className="text-white/60 text-xs mb-0.5">Tiep tuc hoc</p><p className="text-white font-semibold text-sm truncate max-w-xs">{next.title}</p></div>
              <button onClick={()=>onLesson(next)} className="flex-shrink-0 bg-white font-bold text-xs px-4 py-2 rounded-xl hover:opacity-90 transition-colors active:scale-95" style={{color:accent}}>Vao hoc &rarr;</button>
            </div>
          )}
          {completed&&(
            <div className="bg-black/20 px-6 py-3 flex items-center justify-between">
              <p className="text-white font-semibold text-sm">&#127891; Ban da hoan thanh khoa hoc!</p>
              <button onClick={onCert} className="flex-shrink-0 bg-white font-bold text-xs px-4 py-2 rounded-xl hover:opacity-90 active:scale-95" style={{color:accent}}>Nhan chung chi &rarr;</button>
            </div>
          )}
        </div>
        {mods.map(mod=>{
          const ml=mod.lessons;
          const mdone=ml.filter(l=>progress[l.id]).length;
          const isExp=expanded===mod.id;
          return(
            <div key={mod.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden card-lift">
              <button onClick={()=>setExpanded(isExp?null:mod.id)} className="w-full flex items-center gap-4 px-5 py-4 text-left hover:bg-gray-50 transition-colors">
                <span className="text-2xl flex-shrink-0">{mod.icon}</span>
                <div className="flex-1 min-w-0">
                  <p className="font-semibold text-gray-900 text-sm leading-snug">{mod.title}</p>
                  <div className="flex items-center gap-2 mt-1.5">
                    <div className="flex-1"><PBar val={mdone} max={ml.length} color={accent} h={5}/></div>
                    <span className="text-xs text-gray-400 flex-shrink-0">{mdone}/{ml.length}</span>
                  </div>
                </div>
                <span className="text-gray-400 flex-shrink-0 text-sm">{isExp?'^':'v'}</span>
              </button>
              {isExp&&(
                <div className="border-t border-gray-100">
                  {ml.map((lesson,li)=>{
                    const unlocked=isUnlocked(lesson.id,progress,courseId);
                    const lDone=!!progress[lesson.id];
                    const isCurrent=!lDone&&unlocked;
                    return(
                      <button key={lesson.id} onClick={()=>unlocked&&onLesson(lesson)} disabled={!unlocked}
                        className={`lesson-item w-full flex items-center gap-4 px-5 py-3.5 text-left border-b border-gray-50 last:border-0 ${unlocked?'cursor-pointer':'opacity-40 cursor-not-allowed'} ${isCurrent?'bg-rni-50/50':''}`}>
                        <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border-2 transition-all ${lDone?'text-white':'text-gray-400 border-gray-300 bg-white'}`} style={lDone?{background:accent,borderColor:accent}:isCurrent?{borderColor:accent,color:accent,background:`${accent}10`}:{}}>
                          {lDone?'&#10003;':!unlocked?'&#128274;':li+1}
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className={`text-sm font-medium leading-snug truncate ${lDone?'text-gray-400 line-through':isCurrent?'font-semibold':'text-gray-700'}`} style={isCurrent?{color:accent}:{}}>{lesson.title}</p>
                          {isCurrent&&<p className="text-xs mt-0.5" style={{color:accent}}>Tiep tuc &rarr;</p>}
                        </div>
                        {unlocked&&!lDone&&<span className="text-gray-300 flex-shrink-0">&rsaquo;</span>}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
        {completed&&(
          <button onClick={onCert} className="w-full py-4 rounded-2xl font-semibold text-white text-sm shadow-lg transition-all active:scale-95" style={{background:'linear-gradient(135deg,#f59e0b,#d97706)'}}>
            &#127891; Nhan chung chi hoan thanh
          </button>
        )}
        <div className="text-center py-4 border-t border-gray-100">
          <p className="text-xs text-gray-400"><span className="font-semibold text-rni-600">Hoc vien RNI</span> &middot; Return &middot; Nurture &middot; Illuminate</p>
        </div>
      </div>
      <ChatButton/>
    </div>
  );
}

            <h3 className="font-heading font-black text-xl text-gray-900 mb-2">Nhan chung chi qua Zalo</h3>
            <p className="text-gray-500 text-sm leading-relaxed mb-5">Nhan nut ben duoi de truy cap Zalo OA cua RNI. Nhan Quan tam - Zalo OA se tu dong gui chung chi cho ban ngay sau do.</p>
            <div className="rounded-xl overflow-hidden mb-4" style={{height:400}}>
              <iframe src="https://zalo.me/4096198069463501502" width="100%" height="400" frameBorder="0" title="Zalo OA RNI"/>
            </div>
            <button onClick={()=>setShowZalo(false)} className="w-full py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm hover:border-gray-300 transition-all">Dong</button>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState('preQuiz');
  const [userName,setUserName]=useState('');
  const [quizResult,setQuizResult]=useState(null);
  const [courseId,setCourseId]=useState(null);
  const [lesson,setLesson]=useState(null);
  const [progress,setProgress]=useState(()=>{try{return JSON.parse(localStorage.getItem('rni-progress')||'{}');}catch{return{};}});

  useEffect(()=>{try{localStorage.setItem('rni-progress',JSON.stringify(progress));}catch{}},[progress]);

  useEffect(()=>{
    try{
      const n=localStorage.getItem('rni-name');
      const c=localStorage.getItem('rni-course');
      const savedScreen=localStorage.getItem('rni-screen');
      const savedResult=localStorage.getItem('rni-quiz-result');
      if(n&&c){setUserName(n);setCourseId(c);if(savedScreen==='cert'){setScreen('cert');}else{setScreen('dashboard');}}
      else if(savedResult){setQuizResult(savedResult);setCourseId(savedResult);setScreen('quizResult');}
    }catch{}
  },[]);

  useEffect(()=>{
    try{
      if(['cert','dashboard'].includes(screen)){localStorage.setItem('rni-screen',screen);}
      else{localStorage.removeItem('rni-screen');}
    }catch{}
  },[screen]);

  const done=(id)=>setProgress(p=>({...p,[id]:true}));
  const reset=()=>{
    try{localStorage.removeItem('rni-name');localStorage.removeItem('rni-course');localStorage.removeItem('rni-email');localStorage.removeItem('rni-screen');localStorage.removeItem('rni-quiz-result');}catch{}
    setScreen('preQuiz');setUserName('');setCourseId(null);setQuizResult(null);setProgress({});
  };

  if(screen==='preQuiz')return <PreQuizScreen onStart={()=>setScreen('quizTransition')}/>;
  if(screen==='quizTransition')return <QuizTransition onDone={()=>setScreen('quiz')} onBack={()=>setScreen('preQuiz')}/>;
  if(screen==='quiz')return <QuizScreen onDone={r=>{setQuizResult(r);setCourseId(r);try{localStorage.setItem('rni-quiz-result',r);}catch{}setScreen('quizLoading');}} onBack={()=>setScreen('quizTransition')}/>;
  if(screen==='quizLoading')return <QuizLoading onDone={()=>setScreen('quizResult')}/>;
  if(screen==='quizResult')return <QuizResultScreen result={quizResult} onContinue={()=>setScreen('register')} onBack={()=>setScreen('quiz')}/>;
  if(screen==='register')return <RegisterScreen courseId={courseId} onBack={()=>setScreen('quizResult')} onDone={(n,e)=>{const name=n||'Hoc vien';setUserName(name);try{localStorage.setItem('rni-name',name);if(e)localStorage.setItem('rni-email',e);localStorage.setItem('rni-course',courseId);localStorage.removeItem('rni-quiz-result');}catch{}setScreen('dashboard');}}/>;
  if(screen==='cert')return <CertScreen userName={userName} courseId={courseId} onBack={()=>setScreen('dashboard')} onDone={()=>setScreen('dashboard')}/>;
  if(screen==='lesson'&&lesson)return <LessonView lesson={lesson} progress={progress} courseId={courseId} onComplete={done} onBack={()=>{setLesson(null);setScreen('dashboard');}}/>;
  return <Dashboard userName={userName} courseId={courseId} progress={progress} onLesson={l=>{setLesson(l);setScreen('lesson');}} onCert={()=>setScreen('cert')} onRedo={()=>{try{localStorage.removeItem('rni-name');localStorage.removeItem('rni-course');localStorage.removeItem('rni-email');}catch{}setUserName('');setCourseId(null);setScreen('preQuiz');}}/>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
