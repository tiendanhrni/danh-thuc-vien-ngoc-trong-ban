// ── HELPERS ───────────────────────────────────────────────────────────────────
const getModules = (courseId) => COURSES[courseId]?.modules || [];
const getAllLessons = (courseId) =>
  getModules(courseId).flatMap(m => m.lessons.map(l => ({...l, moduleId:m.id})));

function getLessonIndex(lessonId, courseId) {
  return getAllLessons(courseId).findIndex(l => l.id === lessonId);
}
function isLessonUnlocked(lessonId, progress, courseId) {
  const all = getAllLessons(courseId);
  const idx = all.findIndex(l => l.id === lessonId);
  if(idx === 0) return true;
  return !!progress[all[idx-1].id];
}

function ProgressBar({value, max, className=''}) {
  const pct = Math.round((value/max)*100);
  return (
    <div className={`w-full bg-rni-100 rounded-full h-2 ${className}`}>
      <div className="progress-bar bg-gradient-to-r from-rni-600 to-gold-500 h-2 rounded-full"
        style={{width:`${pct}%`}}/>
    </div>
  );
}

function Btn({children, onClick, variant='primary', size='md', disabled=false, className=''}) {
  const base = 'inline-flex items-center justify-center font-semibold rounded-xl transition-all focus:outline-none active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed';
  const V = {
    primary:'bg-rni-600 text-white hover:bg-rni-700 shadow-md hover:shadow-lg',
    secondary:'bg-white text-rni-600 border-2 border-rni-200 hover:border-rni-400',
    gold:'bg-gradient-to-r from-gold-500 to-gold-400 text-white shadow-md hover:shadow-lg',
    ghost:'text-rni-600 hover:bg-rni-50',
  };
  const S = {sm:'px-4 py-2 text-xs', md:'px-5 py-2.5 text-sm', lg:'px-8 py-3.5 text-base'};
  return (
    <button onClick={onClick} disabled={disabled}
      className={`${base} ${V[variant]} ${S[size]} ${className}`}>
      {children}
    </button>
  );
}

function QuizScreen({onDone}) {
  const [idx, setIdx]           = useState(0);
  const [answers, setAnswers]   = useState([]);
  const [selected, setSelected] = useState(null);
  const [animating, setAnimating] = useState(false);

  const q = QUIZ_QUESTIONS[idx];
  const partLabels = {
    1:"Bạn đang thấy gì ở chính mình lúc này?",
    2:"Bạn đang nuôi dưỡng điều gì bên trong?",
    3:"Bạn đang hướng về đâu?"
  };
  const partIntros = {
    1:"Không cần suy nghĩ quá nhiều. Hãy chọn điều gần với bạn nhất lúc này.",
    2:"Quan sát thật nhẹ nhàng — không cần đánh giá bản thân.",
    3:"Đây là phần cuối — hãy để trực giác dẫn lối."
  };
  const isFirstOfPart = idx === 0 || QUIZ_QUESTIONS[idx-1].part !== q.part;
  const pct = Math.round(((idx+1)/QUIZ_QUESTIONS.length)*100);

  const handleSelect = (i) => {
    if(animating) return;
    setSelected(i);
    setAnimating(true);
    setTimeout(()=>{
      const newAnswers = [...answers, i];
      setAnswers(newAnswers);
      setSelected(null);
      setAnimating(false);
      if(idx < QUIZ_QUESTIONS.length - 1){
        setIdx(idx+1);
      } else {
        const counts = {0:0,1:0,2:0};
        newAnswers.forEach(a => counts[a]++);
        let result = 'R';
        if(counts[2] >= counts[1] && counts[2] >= counts[0]) result = 'I';
        else if(counts[1] >= counts[0] && counts[1] >= counts[2]) result = 'N';
        onDone(result);
      }
    }, 350);
  };

  return (
    <div className="min-h-screen flex flex-col hero-bg">
      {/* Top bar */}
      <div className="bg-white border-b border-rni-100 px-4 py-3 sticky top-0 z-20">
        <div className="max-w-lg mx-auto">
          <div className="flex items-center justify-between mb-2">
            <p className="text-xs text-rni-500 font-semibold">{partLabels[q.part]}</p>
            <span className="text-xs text-gray-400 font-medium">{idx+1} / {QUIZ_QUESTIONS.length}</span>
          </div>
          <ProgressBar value={idx+1} max={QUIZ_QUESTIONS.length}/>
        </div>
      </div>

      <div className="flex-1 flex items-start justify-center px-4 py-8">
        <div className="max-w-lg w-full">

          {isFirstOfPart && (
            <div className="mb-5 text-center fade-in">
              <span className="inline-block bg-rni-50 border border-rni-100 text-rni-600 text-xs font-semibold px-4 py-1.5 rounded-full mb-2">
                Phần {q.part}
              </span>
              <p className="text-gray-400 text-sm italic">{partIntros[q.part]}</p>
            </div>
          )}

          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-5 fade-in">
            <p className="font-display text-xl font-semibold text-gray-900 leading-relaxed">{q.q}</p>
          </div>

          <div className="space-y-3">
            {q.opts.map((opt,i)=>(
              <button key={i} onClick={()=>handleSelect(i)}
                className={`option-btn w-full text-left p-4 rounded-2xl border-2 text-sm leading-relaxed transition-all ${
                  selected===i
                    ? 'border-rni-500 bg-rni-50 shadow-md option-selected'
                    : 'border-gray-200 bg-white hover:border-rni-300 hover:bg-rni-50'
                }`}>
                <span className={`inline-flex w-7 h-7 rounded-full border-2 mr-3 items-center justify-center text-xs font-bold flex-shrink-0 align-middle ${
                  selected===i
                    ? 'border-rni-500 bg-rni-500 text-white'
                    : 'border-gray-300 text-gray-400'
                }`}>{String.fromCharCode(65+i)}</span>
                {opt}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

              />

            <div>
              <label className="block text-xs font-semibold text-gray-600 mb-1.5">Email *</label>
              <input

  );
}

// ── PRACTICE BOX ─────────────────────────────────────────────────────────────
function PracticeBox({practice, lessonId}) {
  const key = `rni-journal-${lessonId}`;
  const [text, setText] = useState(()=>localStorage.getItem(key)||'');
  const [saved, setSaved] = useState(false);

  const save = () => {
    localStorage.setItem(key, text);
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  if(!practice) return null;

  return (
    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5">
      <div className="flex items-center gap-2 mb-3">
        <span className="text-lg">✍️</span>
        <h4 className="font-semibold text-gray-800 text-sm">Thực hành</h4>
      </div>
      <p className="text-gray-600 text-sm leading-relaxed mb-4">{practice.prompt}</p>
      {practice.type === 'journal' && (
        <>
          <textarea
            value={text}
            onChange={e=>setText(e.target.value)}
            placeholder={practice.placeholder}
            rows={6}
            className="w-full border-2 border-amber-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400 bg-white resize-none transition-colors"
          />
          <div className="flex items-center justify-between mt-3">
            <span className="text-xs text-gray-400">{text.length} ký tự</span>
            <button onClick={save}
              className="px-4 py-2 rounded-lg text-xs font-semibold transition-all active:scale-95"
              style={{background: saved ? '#10b981' : '#9b1106', color:'white'}}>
              {saved ? '✓ Đã lưu' : 'Lưu ghi chép'}
            </button>
          </div>
        </>
      )}
      {practice.type === 'text' && (
        <div className="bg-white border border-amber-200 rounded-xl px-4 py-3">
          <p className="text-amber-700 text-xs font-medium">💡 Thực hành offline — không cần ghi chép trên app</p>
        </div>
      )}

  );
}

// ── LESSON VIEW ───────────────────────────────────────────────────────────────
function LessonView({lesson, progress, courseId, onComplete, onBack}) {
  const [tab, setTab]           = useState('video');
  const [quizIdx, setQuizIdx]   = useState(0);
  const [picked, setPicked]     = useState(null);
  const [checked, setChecked]   = useState(false);
  const [quizDone, setQuizDone] = useState(false);
  const [showCelebration, setShowCelebration] = useState(false);
  const [score, setScore]       = useState(0);

  const allLessons = getAllLessons(courseId);
  const lessonIdx  = allLessons.findIndex(l=>l.id===lesson.id);
  const nextLesson = allLessons[lessonIdx+1] || null;
  const mod        = getModules(courseId).find(m=>m.lessons.some(l=>l.id===lesson.id));
  const isSimple   = mod?.noPracticeAndQuiz;
  const isCompleted = !!progress[lesson.id];

  const handleCheck = () => {
    if(picked===null) return;
    setChecked(true);
    if(picked === lesson.quiz[quizIdx].correct) setScore(s=>s+1);
  };

  const handleNext = () => {
    if(quizIdx < lesson.quiz.length-1){
      setQuizIdx(quizIdx+1);
      setPicked(null);
      setChecked(false);
    } else {
      setQuizDone(true);
    }
  };

  const handleComplete = () => {
    onComplete(lesson.id);
    setShowCelebration(true);
  };

  const handleNextLesson = () => {
    setShowCelebration(false);
    if(nextLesson) {
      onComplete(lesson.id);
      onBack();
    }
  };

  const tabs = isSimple
    ? [{id:'video', label:'📹 Video'}]
    : [{id:'video', label:'📹 Video'}, {id:'quiz', label:'📝 Kiểm tra'}, {id:'practice', label:'✍️ Thực hành'}];

  return (
    <div className="min-h-screen bg-gray-50">

      {/* Header */}
      <div className="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-20">
        <div className="max-w-2xl mx-auto flex items-center gap-3">
          <button onClick={onBack}
            className="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors flex-shrink-0">
            ←
          </button>
          <div className="flex-1 min-w-0">
            <p className="text-xs text-gray-400 truncate">{mod?.title}</p>
            <p className="text-sm font-semibold text-gray-900 leading-tight truncate">{lesson.title}</p>
          </div>
          {isCompleted && (
            <span className="flex-shrink-0 bg-green-100 text-green-700 text-xs font-semibold px-3 py-1 rounded-full">
              ✓ Hoàn thành
            </span>
          )}
        </div>
      </div>

      {/* Tabs */}
      {tabs.length > 1 && (
        <div className="bg-white border-b border-gray-100 px-4">
          <div className="max-w-2xl mx-auto flex">
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                className={`px-5 py-3 text-sm font-semibold transition-colors ${
                  tab===t.id ? 'tab-active' : 'tab-inactive'
                }`}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      )}

      <div className="max-w-2xl mx-auto px-4 py-6">

        {/* VIDEO TAB */}
        {tab==='video' && (
          <div className="space-y-5 fade-in">
            {lesson.videoId ? (
              <div className="video-wrap">
                <iframe
                  src={`https://www.youtube.com/embed/${lesson.videoId}?rel=0&modestbranding=1`}
                  title={lesson.title}
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowFullScreen/>
              </div>
            ) : (
              <div className="bg-gray-900 rounded-2xl flex items-center justify-center"
                style={{aspectRatio:'16/9'}}>
                <div className="text-center text-white">
                  <div className="text-5xl mb-3">🎬</div>
                  <p className="text-sm font-medium opacity-70">Video sẽ sớm ra mắt</p>
                  <p className="text-xs opacity-40 mt-1">Đang trong quá trình sản xuất</p>
                </div>
              </div>
            )}

            <div className="bg-white rounded-2xl border border-gray-100 p-5">
              <h2 className="font-heading font-black text-lg text-gray-900 mb-2 leading-snug">{lesson.title}</h2>
              <p className="text-gray-500 text-sm leading-relaxed">{lesson.desc}</p>
            </div>

            {isSimple && !isCompleted && (
              <button onClick={handleComplete}
                className="w-full py-3.5 rounded-xl bg-rni-600 text-white font-semibold text-sm shadow-md hover:bg-rni-700 transition-all active:scale-95">
                Đánh dấu hoàn thành ✓
              </button>
            )}

            {!isSimple && (
              <div className="grid grid-cols-2 gap-3">
                <button onClick={()=>setTab('quiz')}
                  className="py-3 rounded-xl border-2 border-rni-200 text-rni-600 font-semibold text-sm hover:bg-rni-50 transition-all">
                  📝 Làm kiểm tra
                </button>
                <button onClick={()=>setTab('practice')}
                  className="py-3 rounded-xl border-2 border-amber-200 text-amber-700 font-semibold text-sm hover:bg-amber-50 transition-all">
                  ✍️ Thực hành
                </button>
              </div>
            )}
          </div>
        )}

        {/* QUIZ TAB */}
        {tab==='quiz' && !isSimple && (
          <div className="fade-in">
            {!quizDone ? (
              <div className="space-y-4">
                <div className="flex items-center justify-between mb-2">
                  <p className="text-xs font-semibold text-gray-500">Câu {quizIdx+1} / {lesson.quiz.length}</p>
                  <span className="text-xs text-gray-400">{score} điểm</span>
                </div>
                <ProgressBar value={quizIdx+1} max={lesson.quiz.length} className="mb-4"/>

                <div className="bg-white rounded-2xl border border-gray-100 p-5">
                  <p className="font-display text-base font-semibold text-gray-900 leading-relaxed">
                    {lesson.quiz[quizIdx].q}
                  </p>
                </div>

                <div className="space-y-3">
                  {lesson.quiz[quizIdx].opts.map((opt,i)=>{
                    let cls = 'border-2 border-gray-200 bg-white';
                    if(checked){
                      if(i===lesson.quiz[quizIdx].correct) cls = 'border-2 border-green-500 bg-green-50';
                      else if(i===picked) cls = 'border-2 border-red-400 bg-red-50';
                    } else if(picked===i) cls = 'border-2 border-rni-400 bg-rni-50';
                    return (
                      <button key={i}
                        onClick={()=>!checked && setPicked(i)}
                        className={`w-full text-left p-4 rounded-2xl text-sm leading-relaxed transition-all ${cls} ${!checked?'hover:border-rni-300':''}`}>
                        <span className={`inline-flex w-6 h-6 rounded-full border-2 mr-3 items-center justify-center text-xs font-bold flex-shrink-0 align-middle ${
                          checked && i===lesson.quiz[quizIdx].correct ? 'border-green-500 bg-green-500 text-white' :
                          checked && i===picked ? 'border-red-400 bg-red-400 text-white' :
                          picked===i ? 'border-rni-500 bg-rni-500 text-white' :
                          'border-gray-300 text-gray-400'
                        }`}>{String.fromCharCode(65+i)}</span>
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {!checked ? (
                  <button onClick={handleCheck} disabled={picked===null}
                    className="w-full py-3.5 rounded-xl bg-rni-600 text-white font-semibold text-sm shadow-md hover:bg-rni-700 transition-all active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed">
                    Kiểm tra đáp án
                  </button>
                ) : (
                  <div className="space-y-3">
                    <div className={`rounded-xl px-4 py-3 text-sm font-semibold ${
                      picked===lesson.quiz[quizIdx].correct
                        ? 'bg-green-100 text-green-700'
                        : 'bg-red-50 text-red-600'
                    }`}>
                      {picked===lesson.quiz[quizIdx].correct
                        ? '✓ Chính xác! Bạn hiểu đúng rồi.'
                        : `✗ Chưa đúng. Đáp án là: ${String.fromCharCode(65+lesson.quiz[quizIdx].correct)}.`}
                    </div>
                    <button onClick={handleNext}
                      className="w-full py-3.5 rounded-xl bg-rni-600 text-white font-semibold text-sm shadow-md hover:bg-rni-700 transition-all active:scale-95">
                      {quizIdx < lesson.quiz.length-1 ? 'Câu tiếp theo →' : 'Xem kết quả'}
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <div className="text-center py-8 fade-in">
                <div className="text-5xl mb-4">{score===lesson.quiz.length?'🏆':score>=lesson.quiz.length/2?'⭐':'📖'}</div>
                <h3 className="font-heading font-black text-2xl text-gray-900 mb-2">
                  {score} / {lesson.quiz.length} câu đúng
                </h3>
                <p className="text-gray-500 text-sm mb-6">
                  {score===lesson.quiz.length
                    ? 'Xuất sắc! Bạn nắm vững bài học này rồi.'
                    : score>=lesson.quiz.length/2
                    ? 'Tốt lắm! Bạn đã hiểu phần lớn bài học.'
                    : 'Hãy xem lại video để củng cố thêm nhé!'}
                </p>
                {!isCompleted && (
                  <button onClick={handleComplete}
                    className="w-full py-3.5 rounded-xl bg-rni-600 text-white font-semibold text-sm shadow-md hover:bg-rni-700 transition-all active:scale-95 mb-3">
                    Đánh dấu hoàn thành ✓
                  </button>
                )}
                <button onClick={()=>{ setQuizIdx(0); setPicked(null); setChecked(false); setQuizDone(false); setScore(0); }}
                  className="w-full py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm hover:border-gray-300 transition-all">
                  Làm lại
                </button>
              </div>
            )}
          </div>
        )}

        {/* PRACTICE TAB */}
        {tab==='practice' && !isSimple && (
          <div className="space-y-5 fade-in">
            <PracticeBox practice={lesson.practice} lessonId={lesson.id}/>
            {!isCompleted && (
              <button onClick={handleComplete}
                className="w-full py-3.5 rounded-xl bg-rni-600 text-white font-semibold text-sm shadow-md hover:bg-rni-700 transition-all active:scale-95">
                Đánh dấu hoàn thành ✓
              </button>
            )}
          </div>
        )}
      </div>

      {showCelebration && (
        <CelebrationPopup
          lesson={lesson}
          onClose={onBack}
          onNext={handleNextLesson}
          hasNext={!!nextLesson}
        />
      )}
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({userName, courseId, progress, onLesson, onCert}) {
  const [expandedMod, setExpandedMod] = useState(1);
  const course     = COURSES[courseId];
  const modules    = getModules(courseId);
  const allLessons = getAllLessons(courseId);
  const r          = QUIZ_RESULTS[courseId];
  const done       = allLessons.filter(l=>progress[l.id]).length;
  const total      = allLessons.length;
  const allDone    = done === total;
  const pct        = Math.round((done/total)*100);

  // Find next lesson
  const nextLesson = allLessons.find(l=>!progress[l.id]);

  return (
    <div className="min-h-screen bg-gray-50">

      {/* Header */}
      <div className="bg-white border-b border-gray-100 px-4 py-4 sticky top-0 z-20">
        <div className="max-w-2xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <LogoMark className="h-10 w-10 text-sm"/>
            <div>
              <p className="font-heading font-black text-sm text-gray-900 leading-tight line-clamp-1">{course?.title}</p>
              <p className="text-xs text-gray-400">{course?.subtitle}</p>
            </div>
          </div>
          <div className="text-right">
            <p className="text-xs font-semibold text-rni-600">{pct}%</p>
            <p className="text-xs text-gray-400">{done}/{total} bài</p>
          </div>
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 py-5 space-y-5">

        {/* Hero card */}
        <div className="rounded-2xl overflow-hidden shadow-sm"
          style={{background:`linear-gradient(135deg,${r?.accentColor||'#9b1106'} 0%,#c41a0a 60%,#d97706 100%)`}}>
          <div className="px-6 py-5 text-white">
            <p className="text-sm opacity-80 mb-0.5">Xin chào,</p>
            <h2 className="font-heading font-black text-2xl mb-3">{userName} ✦</h2>
            <ProgressBar value={done} max={total} className="mb-2 [&>div]:bg-white [&]:bg-white/30"/>
            <div className="flex items-center justify-between">
              <p className="text-xs opacity-75">{done} / {total} bài học hoàn thành</p>
              <p className="text-xs font-bold">{pct}%</p>
            </div>
          </div>
          {nextLesson && (
            <div className="bg-black/20 px-6 py-3 flex items-center justify-between">
              <div>
                <p className="text-white/60 text-xs mb-0.5">Tiếp tục học</p>
                <p className="text-white font-semibold text-sm truncate max-w-xs">{nextLesson.title}</p>
              </div>
              <button onClick={()=>onLesson(nextLesson)}
                className="flex-shrink-0 bg-white text-rni-700 font-bold text-xs px-4 py-2 rounded-xl hover:bg-rni-50 transition-colors active:scale-95">
                Vào học →
              </button>
            </div>
          )}
          {allDone && (
            <div className="bg-black/20 px-6 py-3 flex items-center justify-between">
              <p className="text-white font-semibold text-sm">🎓 Bạn đã hoàn thành khoá học!</p>
              <button onClick={onCert}
                className="flex-shrink-0 bg-white text-rni-700 font-bold text-xs px-4 py-2 rounded-xl hover:bg-rni-50 transition-colors active:scale-95">
                Nhận chứng chỉ →
              </button>
            </div>
          )}
        </div>

        {/* Modules */}
        {modules.map(mod=>{
          const modLessons = mod.lessons;
          const modDone    = modLessons.filter(l=>progress[l.id]).length;
          const isExpanded = expandedMod === mod.id;

          return (
            <div key={mod.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden card-hover">

              {/* Module header */}
              <button
                onClick={()=>setExpandedMod(isExpanded ? null : mod.id)}
                className="w-full flex items-center gap-4 px-5 py-4 text-left hover:bg-gray-50 transition-colors">
                <span className="text-2xl flex-shrink-0">{mod.icon}</span>
                <div className="flex-1 min-w-0">
                  <p className="font-semibold text-gray-900 text-sm leading-snug">{mod.title}</p>
                  <div className="flex items-center gap-2 mt-1">
                    <ProgressBar value={modDone} max={modLessons.length} className="flex-1 h-1.5 [&]:bg-gray-100"/>
                    <span className="text-xs text-gray-400 flex-shrink-0">{modDone}/{modLessons.length}</span>
                  </div>
                </div>
                <span className="text-gray-400 flex-shrink-0">{isExpanded?'▲':'▼'}</span>
              </button>

              {/* Lessons list */}
              {isExpanded && (
                <div className="border-t border-gray-100">
                  {modLessons.map((lesson,idx)=>{
                    const unlocked = isLessonUnlocked(lesson.id, progress, courseId);
                    const completed = !!progress[lesson.id];
                    const isCurrent = !completed && unlocked;
                    return (
                      <button
                        key={lesson.id}
                        onClick={()=>unlocked && onLesson(lesson)}
                        disabled={!unlocked}
                        className={`w-full flex items-center gap-4 px-5 py-3.5 text-left border-b border-gray-50 last:border-0 transition-all ${
                          unlocked
                            ? 'hover:bg-rni-50 cursor-pointer'
                            : 'module-locked cursor-not-allowed'
                        } ${isCurrent ? 'bg-rni-50/50' : ''}`}>

                        {/* Status icon */}
                        <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border-2 ${
                          completed
                            ? 'bg-green-500 border-green-500 text-white'
                            : isCurrent
                            ? 'bg-rni-600 border-rni-600 text-white'
                            : 'bg-white border-gray-300 text-gray-400'
                        }`}>
                          {completed ? '✓' : !unlocked ? '🔒' : idx+1}
                        </div>

                        <div className="flex-1 min-w-0">
                          <p className={`text-sm font-medium leading-snug truncate ${
                            completed ? 'text-gray-500 line-through' : isCurrent ? 'text-rni-700 font-semibold' : 'text-gray-700'
                          }`}>{lesson.title}</p>
                          {isCurrent && (
                            <p className="text-xs text-rni-500 font-medium mt-0.5">Tiếp tục →</p>
                          )}
                        </div>

                        {unlocked && !completed && (
                          <span className="flex-shrink-0 text-gray-300">›</span>
                        )}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}

        {/* Cert button if all done */}
        {allDone && (
          <button onClick={onCert}
            className="w-full py-4 rounded-2xl font-semibold text-white text-sm shadow-lg transition-all active:scale-95"
            style={{background:'linear-gradient(135deg,#f59e0b 0%,#d97706 100%)'}}>
            🎓 Nhận chứng chỉ hoàn thành
          </button>
        )}

        {/* Footer */}
        <div className="text-center py-4 border-t border-gray-100">
          <p className="text-xs text-gray-400">
            <span className="font-semibold text-rni-600">Học viện RNI</span>
            {' '}· Return · Nurture · Illuminate
          </p>
          <p className="text-xs text-gray-300 italic mt-1">
            "Mỗi người đều mang trong mình một ngọn sáng."
          </p>
        </div>
      </div>

      {/* Chat button */}
      <div className="fixed bottom-6 right-4 z-30">
        <button
          onClick={()=>window.open('https://udify.app/chatbot/iRRHff5wqLnKt2ct','_blank')}
          className="bg-rni-600 text-white rounded-full shadow-lg hover:bg-rni-700 transition-all active:scale-95 flex items-center gap-2 px-4 py-3">
          <span className="text-lg">💬</span>
          <span className="text-xs font-semibold hidden sm:inline">Chat với RNI</span>
        </button>
      </div>
    </div>
  );
}

// ── CERT SCREEN ───────────────────────────────────────────────────────────────
function CertScreen({userName, courseId, onBack}) {
  const canvasRef = useRef(null);
  const course    = COURSES[courseId];
  const r         = QUIZ_RESULTS[courseId];

  useEffect(()=>{
    const canvas = canvasRef.current;
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Background
    ctx.fillStyle = '#fdfbf7';
    ctx.fillRect(0,0,W,H);

    // Outer border
    ctx.strokeStyle = r?.accentColor||'#9b1106';
    ctx.lineWidth = 6;
    ctx.strokeRect(24,24,W-48,H-48);

    // Inner border
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(36,36,W-72,H-72);

    // Corner decorations
    const corners = [[50,50],[W-50,50],[50,H-50],[W-50,H-50]];
    corners.forEach(([x,y])=>{
      ctx.fillStyle = r?.accentColor||'#9b1106';
      ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
    });

    // Header
    ctx.fillStyle = r?.accentColor||'#9b1106';
    ctx.font = 'bold 15px Montserrat, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('HỌC VIỆN RNI', W/2, 90);

    ctx.fillStyle = '#9ca3af';
    ctx.font = '11px Montserrat, sans-serif';
    ctx.fillText('Return · Nurture · Illuminate', W/2, 110);

    // Divider
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2-80, 125); ctx.lineTo(W/2+80, 125); ctx.stroke();

    // Certificate title
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'italic 13px Cormorant Garamond, serif';
    ctx.fillText('Chứng Nhận Hoàn Thành', W/2, 155);

    // Name
    ctx.fillStyle = r?.accentColor||'#9b1106';
    ctx.font = 'bold 28px Cormorant Garamond, serif';
    ctx.fillText(userName, W/2, 200);

    // Divider under name
    ctx.strokeStyle = r?.accentColor||'#9b1106';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(W/2-120, 215); ctx.lineTo(W/2+120, 215); ctx.stroke();

    // Course name
    ctx.fillStyle = '#374151';
    ctx.font = '11px Be Vietnam Pro, sans-serif';
    ctx.fillText('đã hoàn thành khoá học', W/2, 240);

    // Wrap course title
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 13px Montserrat, sans-serif';
    const words = (course?.title||'').split(' ');
    let line='', y=265;
    words.forEach(w=>{
      const test = line+w+' ';
      if(ctx.measureText(test).width > W-120 && line!==''){
        ctx.fillText(line.trim(), W/2, y); y+=20; line=w+' ';
      } else { line=test; }
    });
    if(line.trim()) ctx.fillText(line.trim(), W/2, y);

    // Stage badge
    ctx.fillStyle = r?.accentColor||'#9b1106';
    ctx.font = 'italic 11px Cormorant Garamond, serif';
    ctx.fillText(`Giai đoạn ${courseId} — ${r?.stage}`, W/2, y+25);

    // Date
    const today = new Date().toLocaleDateString('vi-VN',{day:'numeric',month:'long',year:'numeric'});
    ctx.fillStyle = '#6b7280';
    ctx.font = '10px Be Vietnam Pro, sans-serif';
    ctx.fillText(today, W/2, H-80);

    // Signature line
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(W/2-60,H-58); ctx.lineTo(W/2+60,H-58); ctx.stroke();
    ctx.fillStyle = '#374151';
    ctx.font = 'bold 11px Montserrat, sans-serif';
    ctx.fillText('Ruby Nguyễn', W/2, H-46);
    ctx.fillStyle = '#9ca3af';
    ctx.font = '9px Be Vietnam Pro, sans-serif';
    ctx.fillText('Founder — Học viện RNI', W/2, H-34);

  },[userName, courseId]);

  const download = () => {
    const a = document.createElement('a');
    a.download = `RNI_Certificate_${userName.replace(/\s+/g,'_')}.png`;
    a.href = canvasRef.current.toDataURL('image/png');
    a.click();
  };

  return (
    <div className="min-h-screen bg-gray-50 flex flex-col">
      <div className="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-20">
        <div className="max-w-2xl mx-auto flex items-center gap-3">
          <button onClick={onBack}
            className="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors">
            ←
          </button>
          <h2 className="font-heading font-black text-base text-gray-900">Chứng chỉ hoàn thành</h2>
        </div>
      </div>

      <div className="max-w-2xl mx-auto px-4 py-8 flex-1">
        <div className="text-center mb-6 bounce-in">
          <div className="text-5xl mb-3 float">🎓</div>
          <h1 className="font-heading font-black text-2xl text-gray-900 mb-1">Chúc mừng, {userName}!</h1>
          <p className="text-gray-500 text-sm">Bạn đã hoàn thành khoá học<br/><strong>{course?.title}</strong></p>
        </div>

        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-5 overflow-auto">
          <canvas ref={canvasRef} width={520} height={380}
            className="max-w-full mx-auto block rounded-xl shadow-sm"/>
        </div>

        <div className="space-y-3">
          <button onClick={download}
            className="w-full py-3.5 rounded-xl bg-rni-600 text-white font-semibold text-sm shadow-md hover:bg-rni-700 transition-all active:scale-95">
            ⬇ Tải chứng chỉ về máy
          </button>
          <button onClick={onBack}
            className="w-full py-3 rounded-xl border-2 border-gray-200 text-gray-600 font-semibold text-sm hover:border-gray-300 transition-all">
            Quay về tổng quan
          </button>
        </div>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [screen,     setScreen]     = useState('preQuiz');
  const [userName,   setUserName]   = useState('');
  const [quizResult, setQuizResult] = useState(null);
  const [courseId,   setCourseId]   = useState(null);
  const [lesson,     setLesson]     = useState(null);
  const [progress,   setProgress]   = useState(()=>{
    try{ return JSON.parse(localStorage.getItem('rni-progress')||'{}'); }
    catch{ return {}; }
  });

  useEffect(()=>{
    localStorage.setItem('rni-progress', JSON.stringify(progress));
  },[progress]);

  // Nếu đã đăng ký → vào thẳng dashboard
  useEffect(()=>{
    const n = localStorage.getItem('rni-name');
    const c = localStorage.getItem('rni-course');
    if(n && c){
      setUserName(n);
      setCourseId(c);
      setScreen('dashboard');
    }
  },[]);

  const done = (id) => setProgress(p=>({...p,[id]:true}));

  if(screen==='preQuiz')
    return <PreQuizScreen onStart={()=>setScreen('quizTransition')}/>;

  if(screen==='quizTransition')
    return <QuizTransition onDone={()=>setScreen('quiz')}/>;

  if(screen==='quiz')
    return <QuizScreen onDone={(r)=>{
      setQuizResult(r);
      setCourseId(r);
      setScreen('quizLoading');
    }}/>;

  if(screen==='quizLoading')
    return <QuizLoading onDone={()=>setScreen('quizResult')}/>;

  if(screen==='quizResult')
    return <QuizResultScreen result={quizResult} onContinue={()=>setScreen('register')}/>;

  if(screen==='register')
    return <RegisterScreen courseId={courseId} onDone={(n,e)=>{
      setUserName(n);
      localStorage.setItem('rni-name', n);
      localStorage.setItem('rni-email', e);
      localStorage.setItem('rni-course', courseId);
      setScreen('welcome');
    }}/>;

  if(screen==='welcome')
    return <WelcomeScreen userName={userName} courseId={courseId} onStart={()=>setScreen('dashboard')}/>;

  if(screen==='cert')
    return <CertScreen userName={userName} courseId={courseId} onBack={()=>setScreen('dashboard')}/>;

  if(screen==='lesson' && lesson)
    return <LessonView lesson={lesson} progress={progress} courseId={courseId}
      onComplete={done} onBack={()=>{ setLesson(null); setScreen('dashboard'); }}/>;

  return <Dashboard userName={userName} courseId={courseId} progress={progress}
    onLesson={l=>{ setLesson(l); setScreen('lesson'); }}
    onCert={()=>setScreen('cert')}/>;
}

// ── MOUNT ─────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
